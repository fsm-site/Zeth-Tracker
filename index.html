/* ---- Actual Commissions — Payment Tracker ---- */
/* Marks every scheduled payment for this client, in this year, up to and
   including the chosen month as Paid, and un-marks anything after it —
   so picking "Latest Premium Paid" from the dropdown is a single action
   instead of checking off each month individually. selectValue === ''
   means "Not paid yet" (clears all months for this client/year).
   Whenever a month is actually chosen, every earlier calendar year for
   this client (back to their issued year) is also filled in as fully
   paid — being current as of, say, August 2026 necessarily means 2022
   through 2025 are already settled, and leaving those years showing
   gaps would just be confusing when someone flips back to check them. */
async function setPrufinLatestPaid(clientKey, year, selectValue){
  if(!prufinLastEstimate) return;
  const monthIndexes = prufinLastEstimate.paymentsFlat
    .filter(p => p.clientKey === clientKey)
    .map(p => p.monthIndex);
  const selected = selectValue === '' ? -1 : Number(selectValue);
  const tracker = await getEntries('prufin-payment-tracker');
  const filtered = tracker.filter(t => !(t.clientKey === clientKey && t.year === year));
  monthIndexes.forEach(mi => {
    if(mi <= selected) filtered.push({ clientKey, monthIndex: mi, year });
  });

  if(selected >= 0){
    const clients = await getEntries('pru-clients');
    const row = clients.find(r => prufinClientKey(r) === clientKey);
    if(row){
      const overrides = await getEntries('prufin-rate-overrides');
      const issuedDate = submittedDateFromMonth(row.submitted, year);
      const startYear = issuedDate ? Math.max(issuedDate.getFullYear(), PRUFIN_RATE_YEARS[0]) : PRUFIN_RATE_YEARS[0];
      for(let y = startYear; y < year; y++){
        const pastEst = computePrufinEstimate([row], overrides, y, 'all');
        pastEst.paymentsFlat.forEach(p => {
          const exists = filtered.some(t => t.clientKey === clientKey && t.year === y && t.monthIndex === p.monthIndex);
          if(!exists) filtered.push({ clientKey, monthIndex: p.monthIndex, year: y });
        });
      }
    }
  }

  await saveEntries('prufin-payment-tracker', filtered);
  await renderPrufinActualSection();
  await renderMoneyIncomePanel();
}
async function renderPrufinActualSection(){
  const mount = document.getElementById('prufin-actual-mount');
  if(!mount) return;
  const est = prufinLastEstimate && prufinLastEstimate.targetYear === prufinViewYear && prufinLastEstimate.filter === prufinClientFilter
    ? prufinLastEstimate
    : null;
  if(!est){ mount.innerHTML = ''; return; } // estimate section renders first and populates this
  const visibleIdx = prufinVisibleMonthIndexes(prufinViewYear);
  if(!visibleIdx.length){
    mount.innerHTML = `<div class="rs-sub">No commissions before August 2022 — pick a later year.</div>`;
    return;
  }
  const tracker = await getEntries('prufin-payment-tracker');
  const paidSet = new Set(tracker.filter(t => t.year === prufinViewYear).map(t => t.clientKey + '|' + t.monthIndex));
  const manualEntries = await getEntries('prufin-manual-actuals');
  const manualForYear = manualEntries.filter(m => m.year === prufinViewYear);
  const clients = await getEntries('pru-clients');
  const issuedDateByKey = {};
  clients.forEach(row => { issuedDateByKey[prufinClientKey(row)] = row.submitted || ''; });

  let actualGross = 0, actualNet = 0, estGross = 0, estNet = 0;
  const byClient = {}; // clientKey -> { name, clientType, plan, mode, months:{monthIndex:{gross,net,paid}} }
  est.paymentsFlat.forEach(p => {
    estGross += p.gross; estNet += p.net;
    const paid = paidSet.has(p.clientKey + '|' + p.monthIndex);
    if(paid){ actualGross += p.gross; actualNet += p.net; }
    if(!byClient[p.clientKey]) byClient[p.clientKey] = { clientKey: p.clientKey, name: p.name, clientType: p.clientType, plan: p.plan, mode: p.mode, months: {} };
    if(!byClient[p.clientKey].months[p.monthIndex]) byClient[p.clientKey].months[p.monthIndex] = { gross: 0, net: 0 };
    byClient[p.clientKey].months[p.monthIndex].gross += p.gross;
    byClient[p.clientKey].months[p.monthIndex].net += p.net;
    byClient[p.clientKey].months[p.monthIndex].paid = paid;
  });
  const manualTotal = manualForYear.reduce((a, m) => a + m.amount, 0);
  actualGross += manualTotal;
  actualNet += manualTotal * (1 - PRUFIN_TAX_RATE);
  const clientRows = Object.values(byClient).sort((a, b) => a.name.localeCompare(b.name));
  clientRows.forEach(c => {
    const monthEntries = Object.entries(c.months).map(([idx, m]) => ({ idx: Number(idx), ...m }));
    c.grossTotal = monthEntries.reduce((a, m) => a + m.gross, 0);
    c.netTotal = monthEntries.reduce((a, m) => a + m.net, 0);
    const paidMonths = monthEntries.filter(m => m.paid).map(m => m.idx);
    c.latestPaidIdx = paidMonths.length ? Math.max(...paidMonths) : -1;
    c.issuedDate = issuedDateByKey[c.clientKey] || '';
    // If nothing's marked paid yet in the year being viewed, look back at
    // earlier years so the dropdown can show where they actually left off
    // (e.g. "last paid Dec 2025") instead of implying they've never paid.
    if(c.latestPaidIdx === -1){
      const priorEntries = tracker.filter(t => t.clientKey === c.clientKey && t.year < prufinViewYear);
      if(priorEntries.length){
        const maxYear = Math.max(...priorEntries.map(t => t.year));
        const maxMonth = Math.max(...priorEntries.filter(t => t.year === maxYear).map(t => t.monthIndex));
        c.priorPaidLabel = `${MONTHS[maxMonth].slice(0,3)} ${maxYear}`;
      }
    }
  });
  prufinActualClientRows = clientRows; // cached for the client-detail popup

  // Split the year's estimate into what's already "due" by now (year-to-date)
  // vs what's still ahead, so the three boxes read as: what should already be
  // in, what's still coming for the rest of the year, and what's actually in.
  const today = new Date();
  const asOfIdx = prufinViewYear < today.getFullYear() ? 11
    : prufinViewYear > today.getFullYear() ? -1
    : today.getMonth();
  let ytdEstGross = 0, ytdEstNet = 0;
  est.paymentsFlat.forEach(p => {
    if(p.monthIndex <= asOfIdx){ ytdEstGross += p.gross; ytdEstNet += p.net; }
  });
  const leftEstGross = estGross - ytdEstGross;
  const leftEstNet = estNet - ytdEstNet;

  const highlightHtml = `
    <div class="prufin-highlight-grid">
      <div class="prufin-highlight-box">
        <div class="phb-label">YTD Estimated Commissions</div>
        <div class="phb-value">${fmtCurrency(ytdEstGross)}</div>
        <div class="phb-sub">Net after 3% tax: ${fmtCurrency(ytdEstNet)}</div>
      </div>
      <div class="prufin-highlight-box">
        <div class="phb-label">Est. Commissions Left to be Collected</div>
        <div class="phb-value">${fmtCurrency(leftEstGross)}</div>
        <div class="phb-sub">Net after 3% tax: ${fmtCurrency(leftEstNet)}</div>
      </div>
      <div class="prufin-highlight-box">
        <div class="phb-label">YTD Actual Commissions</div>
        <div class="phb-value">${fmtCurrency(actualGross)}</div>
        <div class="phb-sub">Net after 3% tax: ${fmtCurrency(actualNet)}${manualTotal ? ` · incl. ${fmtCurrency(manualTotal)} manual` : ''}</div>
      </div>
    </div>
  `;

  const toggleHtml = `<button class="toggle-pill-btn" onclick="togglePrufinShowClients()">${prufinShowClients ? 'Hide Clients' : 'Show Clients'}</button>`;

  const tableHtml = clientRows.length
    ? `<div class="statistics-table-wrap">
        <table class="statistics-table prufin-tracker-table">
          <thead><tr>
            <th style="text-align:left;">Client</th>
            <th style="text-align:left;">Issued Date</th>
            <th style="text-align:left;">Plan</th>
            <th style="text-align:left;">Type</th>
            <th style="text-align:left;">Mode</th>
            <th>Gross</th>
            <th>Latest Premium Paid</th>
          </tr></thead>
          <tbody>${clientRows.map(c => {
            const monthOptions = Object.keys(c.months).map(Number).sort((a, b) => a - b);
            return `
            <tr>
              <td style="text-align:left;"><a href="javascript:void(0)" class="prufin-client-link" onclick="openPrufinClientModal('${prufinJsStr(c.clientKey)}')">${escapeHtml(c.name)}</a></td>
              <td style="text-align:left;">${escapeHtml(fmtIssuedDate(c.issuedDate))}</td>
              <td style="text-align:left;">${escapeHtml(c.plan)}</td>
              <td style="text-align:left;">${escapeHtml(c.clientType)}</td>
              <td style="text-align:left;">${escapeHtml(c.mode)}</td>
              <td class="num">${fmtCurrency(c.grossTotal)}</td>
              <td class="num">
                <select onchange="setPrufinLatestPaid('${prufinJsStr(c.clientKey)}', ${prufinViewYear}, this.value)">
                  <option value="" ${c.latestPaidIdx === -1 ? 'selected' : ''}>Not paid yet${c.priorPaidLabel ? ` (last paid ${c.priorPaidLabel})` : ''}</option>
                  ${monthOptions.map(i => `<option value="${i}" ${c.latestPaidIdx === i ? 'selected' : ''}>${MONTHS[i].slice(0,3)} ${prufinViewYear}</option>`).join('')}
                </select>
                ${c.priorPaidLabel ? `<div class="prufin-cell-sub">Last paid: ${c.priorPaidLabel}</div>` : ''}
              </td>
            </tr>`;
          }).join('')}</tbody>
        </table>
      </div>`
    : `<div class="rs-sub">No expected payments for ${prufinViewYear} yet.</div>`;

  mount.innerHTML = highlightHtml + toggleHtml + (prufinShowClients ? tableHtml : '');

  const overrides = await getEntries('prufin-rate-overrides');
  const tracker = await getEntries('prufin-payment-tracker');

  const est = computePrufinEstimate(clients, overrides, prufinStatsYear, prufinStatsFilter);
  const visibleIdx = prufinVisibleMonthIndexes(prufinStatsYear);
  const paidSet = new Set(tracker.filter(t => t.year === prufinStatsYear).map(t => t.clientKey + '|' + t.monthIndex));

  let actualGross = 0, actualNet = 0, ownGross = 0, adoptedGross = 0;
  const actualByMonth = Array(12).fill(0);
  est.paymentsFlat.forEach(p => {
    if(paidSet.has(p.clientKey + '|' + p.monthIndex)){
      actualGross += p.gross; actualNet += p.net;
      actualByMonth[p.monthIndex] += p.gross;
    }
    if((p.clientType || 'Own') === 'Own') ownGross += p.gross; else adoptedGross += p.gross;
  });
  const estGross = est.overallGross.reduce((a, b) => a + b, 0);
  const estNet = est.overallNet.reduce((a, b) => a + b, 0);
  const collectionRate = estGross ? (actualGross / estGross) * 100 : 0;

  const batchRows = [];
  est.years.forEach(y => {
    const label = `${PRUFIN_ORDINALS[y - 1] || y + 'th'} Year`;
    batchRows.push({ label: label + ' · Gross', value: est.batches[y].gross.reduce((a, c) => a + c, 0), cls: '' });
    batchRows.push({ label: label + ' · Net', value: est.batches[y].net.reduce((a, c) => a + c, 0), cls: 'net' });
  });

  const monthCompareRows = visibleIdx.flatMap(i => ([
    { label: `${MONTHS[i].slice(0,3)} · Estimated`, value: est.overallGross[i], cls: '' },
    { label: `${MONTHS[i].slice(0,3)} · Actual`, value: actualByMonth[i], cls: 'net' },
  ]));

  const combinedOwnAdopted = ownGross + adoptedGross;
  const ownShare = combinedOwnAdopted ? (ownGross / combinedOwnAdopted) * 360 : 0;

  // All-years overview (2022–2030) for the current filter
  const yearlyOverview = [];
  for(const y of PRUFIN_RATE_YEARS){
    const yEst = computePrufinEstimate(clients, overrides, y, prufinStatsFilter);
    const yGross = yEst.overallGross.reduce((a, b) => a + b, 0);
    const yNet = yEst.overallNet.reduce((a, b) => a + b, 0);
    const yPaid = new Set(tracker.filter(t => t.year === y).map(t => t.clientKey + '|' + t.monthIndex));
    let yActual = 0;
    yEst.paymentsFlat.forEach(p => { if(yPaid.has(p.clientKey + '|' + p.monthIndex)) yActual += p.gross; });
    yearlyOverview.push({ year: y, gross: yGross, net: yNet, actual: yActual });
  }

  prufinStatisticsMount.innerHTML = `
    <button class="statistics-back" onclick="closePrufinStatistics()">← Back to PRUFINATED</button>
    <h1>Prufin Statistics</h1>
    <div class="sub">Commission production, collection rate, and Own vs. Adopted performance.</div>
    <div class="prufin-controls-row" style="justify-content:center; margin-bottom:18px;">
      <label class="prufin-controls-label">Year
        <select id="prufin-stats-year-select" onchange="onPrufinStatsYearChange()">
          ${PRUFIN_RATE_YEARS.map(y => `<option value="${y}" ${y === prufinStatsYear ? 'selected' : ''}>${y}</option>`).join('')}
        </select>
      </label>
      <div class="prufin-year-tabs" style="margin:0;">
        <button class="prufin-year-tab ${prufinStatsFilter === 'all' ? 'active' : ''}" onclick="setPrufinStatsFilter('all')">All</button>
        <button class="prufin-year-tab ${prufinStatsFilter === 'own' ? 'active' : ''}" onclick="setPrufinStatsFilter('own')">Own</button>
        <button class="prufin-year-tab ${prufinStatsFilter === 'adopted' ? 'active' : ''}" onclick="setPrufinStatsFilter('adopted')">Adopted</button>
      </div>
    </div>

    <div class="statistics-grid">
      <div class="statistics-card"><h3>Estimated ${prufinStatsYear}</h3><div class="statistics-values"><div><div class="statistics-label">Gross</div><div class="statistics-value">${fmtCurrency(estGross)}</div></div><div><div class="statistics-label">Net</div><div class="statistics-value">${fmtCurrency(estNet)}</div></div></div></div>
      <div class="statistics-card"><h3>Actual ${prufinStatsYear}</h3><div class="statistics-values"><div><div class="statistics-label">Gross</div><div class="statistics-value">${fmtCurrency(actualGross)}</div></div><div><div class="statistics-label">Net</div><div class="statistics-value">${fmtCurrency(actualNet)}</div></div></div></div>
      <div class="statistics-card"><h3>Collected</h3><div class="statistics-values"><div><div class="statistics-label">% of Estimated Gross</div><div class="statistics-value">${collectionRate.toFixed(1)}%</div></div></div></div>
    </div>

    <h2>Yearly Comparison — Gross vs Net (${prufinStatsYear})</h2>
    <div class="stats-sub">Total commission per policy-year batch, gross vs. after the 3% tax.</div>
    <div class="statistics-chart-card">${prufinBarRows(batchRows, 'label', 'value', fmtCurrency)}</div>

    <h2>Estimated vs Actual by Month (${prufinStatsYear})</h2>
    <div class="stats-sub">How much of each month's estimate has actually been marked paid.</div>
    <div class="statistics-chart-card">${prufinBarRows(monthCompareRows, 'label', 'value', fmtCurrency)}</div>

    <h2>Own vs Adopted</h2>
    <div class="stats-sub">Share of estimated ${prufinStatsYear} gross commission.</div>
    <div class="statistics-chart-grid">
      <div class="statistics-chart-card"><h3>Gross Commission by Client Type</h3><div class="statistics-pie" style="background:conic-gradient(var(--brass) 0deg ${ownShare}deg, var(--navy) ${ownShare}deg 360deg);"></div><div class="statistics-legend"><span><i class="statistics-swatch" style="background:var(--brass)"></i>Own ${combinedOwnAdopted ? ((ownGross / combinedOwnAdopted) * 100).toFixed(1) : '0.0'}%</span><span><i class="statistics-swatch" style="background:var(--navy)"></i>Adopted ${combinedOwnAdopted ? ((adoptedGross / combinedOwnAdopted) * 100).toFixed(1) : '0.0'}%</span></div></div>
    </div>

    <h2>Commissions by Year — 2022 to 2030</h2>
    <div class="stats-sub">Estimated vs. Actual gross commission per calendar year, for the current Own/Adopted/All filter.</div>
    <div class="statistics-table-wrap"><table class="statistics-table"><thead><tr><th>Year</th><th>Estimated Gross</th><th>Estimated Net</th><th>Actual Gross</th><th>Collected %</th></tr></thead><tbody>${yearlyOverview.map(row => `<tr><td>${row.year}</td><td class="num">${fmtCurrency(row.gross)}</td><td class="num">${fmtCurrency(row.net)}</td><td class="num">${fmtCurrency(row.actual)}</td><td class="num">${row.gross ? ((row.actual / row.gross) * 100).toFixed(1) : '0.0'}%</td></tr>`).join('')}</tbody></table></div>
  `;
}

/* ==================== HMO COMMISSIONS (Hustles) ====================
   A per-company payment tracker for hmo-clients: each company has its own
   table of clients, one column per calendar month, and a checkbox on any
   month that lands on that client's payment schedule (derived from their
   Effectivity Date + Mode). Ticking a box marks that installment's
   commission as received. Rates are a single flat percent per company,
   editable in the "Commission Rate Schedule" tab above the tables. */
let hmoActiveCompany = HMO_COMPANIES[0];
let hmoViewYear = Math.max(new Date().getFullYear(), HMO_RATE_YEARS[0]);
let hmoSortMode = 'name-asc';
let hmoShowClients = false; // Commissions client table hidden by default, like Issued Clients

function hmoClientKey(row){
  return 'nm:' + String(row.name || '').trim().toLowerCase() + '|' + String(row.submitted || '').trim() + '|' + String(row.hmo || '').trim();
}
/* Every calendar month (0-11) in `year` on which a commission-bearing
   payment is scheduled, given the client's Effectivity Date and Mode —
   starting at the effectivity month and repeating every (12 / frequency)
   months. Nothing is scheduled before the effectivity date, and nothing
   after the month the client went Inactive (if any). */
function hmoScheduleMonths(row, year){
  const freq = HMO_MODE_FREQ[row.mode];
  const effDate = /^\d{4}-\d{2}-\d{2}$/.test(String(row.submitted || '')) ? new Date(row.submitted + 'T00:00:00') : null;
  if(!freq || !effDate || isNaN(effDate.getTime())) return [];
  const stepMonths = 12 / freq;
  const effTotal = effDate.getFullYear() * 12 + effDate.getMonth();
  let cutoffTotal = Infinity;
  if(String(row.status || '').toLowerCase() === 'inactive' && /^\d{4}-\d{2}$/.test(String(row.inactiveSince || ''))){
    const [iy, im] = row.inactiveSince.split('-').map(Number);
    cutoffTotal = iy * 12 + (im - 1);
  }
  const months = [];
  for(let m = 0; m < 12; m++){
    const total = year * 12 + m;
    if(total < effTotal || total > cutoffTotal) continue;
    if((total - effTotal) % stepMonths === 0) months.push(m);
  }
  return months;
}
function hmoScheduleLabel(row, year){
  const months = hmoScheduleMonths(row, year);
  return months.length ? months.map(m => MONTHS[m].slice(0,3)).join(', ') : (HMO_MODE_FREQ[row.mode] ? '—' : 'Set Mode & Effectivity Date');
}
function hmoRateFor(overrides, company){
  const found = (overrides || []).find(o => o.company === company);
  return found ? found.rate : 0;
}

async function saveHmoRates(){
  const overrides = HMO_COMPANIES.map(c => {
    const v = parseFloat(document.getElementById('hmo-rate-' + c.replace(/\s+/g,'_')).value);
    return { company: c, rate: isNaN(v) ? 0 : v / 100 };

async function renderHmoHighlights(clients, overrides, tracker){
  const mount = document.getElementById('hmo-highlights');
  if(!mount) return;
  const today = new Date();
  const asOfIdx = hmoViewYear < today.getFullYear() ? 11
    : hmoViewYear > today.getFullYear() ? -1
    : today.getMonth();
  let ytdTotal = 0, ytdReceived = 0;
  clients.forEach(row => {
    const rate = hmoRateFor(overrides, row.hmo);
    const amount = parseCurrency(row.premium) * rate;
    hmoScheduleMonths(row, hmoViewYear).forEach(m => {
      if(m > asOfIdx) return;
      ytdTotal += amount;
      const paid = tracker.some(t => t.clientKey === hmoClientKey(row) && t.year === hmoViewYear && t.monthIndex === m);
      if(paid) ytdReceived += amount;

  const ytdToGo = ytdTotal - ytdReceived;

async function renderHmoCompanyTable(clients, overrides, tracker){
  const mount = document.getElementById('hmo-company-mount');
  if(!mount) return;
  const isAll = hmoActiveCompany === 'All';
  const companyClients = isAll ? clients : clients.filter(row => (row.hmo || '') === hmoActiveCompany);
  const sorted = [...companyClients].sort((a, b) => {
    if(hmoSortMode === 'date-asc'){
      const aT = a.submitted ? new Date(a.submitted).getTime() : 0;
      const bT = b.submitted ? new Date(b.submitted).getTime() : 0;
      return aT - bT;
    }
    if(hmoSortMode === 'status-asc') return (a.status || 'Active').localeCompare(b.status || 'Active');
    return (a.name || '').toLowerCase().localeCompare((b.name || '').toLowerCase());
  });
  const flatRate = isAll ? null : hmoRateFor(overrides, hmoActiveCompany);
  const rateForRow = row => isAll ? hmoRateFor(overrides, row.hmo) : flatRate;

  const toggleHtml = `<button class="toggle-pill-btn" onclick="toggleHmoShowClients()">${hmoShowClients ? 'Hide Clients' : 'Show Clients'}</button>`;
  const rateNote = isAll
    ? `<div class="rs-sub">Showing all HMO companies. Hover a checkbox to see its commission amount.</div>`
    : `<div class="rs-sub">Commission rate for ${escapeHtml(hmoActiveCompany)}: <strong>${prufinPct(flatRate)}</strong> of Premium per scheduled payment. Hover a checkbox to see its commission amount.</div>`;

  if(!sorted.length){
    mount.innerHTML = rateNote + toggleHtml + `<div class="rs-sub">No Issued clients yet${isAll ? '' : ' for ' + escapeHtml(hmoActiveCompany)}.</div>`;
    return;
  }

  if(!hmoShowClients){
    mount.innerHTML = rateNote + toggleHtml + `<div class="rs-sub">Client list is hidden. Click "Show Clients" above to view the table.</div>`;
    return;
  }

  const monthlyTotals = MONTHS.map((_, m) => sorted.reduce((sum, row) => {
    const scheduleMonths = hmoScheduleMonths(row, hmoViewYear);
    if(!scheduleMonths.includes(m)) return sum;
    return sum + parseCurrency(row.premium) * rateForRow(row);
  }, 0));
  const monthlyReceived = MONTHS.map((_, m) => sorted.reduce((sum, row) => {
    const scheduleMonths = hmoScheduleMonths(row, hmoViewYear);
    if(!scheduleMonths.includes(m)) return sum;
    const key = hmoClientKey(row);
    const paid = tracker.some(t => t.clientKey === key && t.year === hmoViewYear && t.monthIndex === m);
    if(!paid) return sum;
    return sum + parseCurrency(row.premium) * rateForRow(row);
  }, 0));

  const rows = sorted.map(row => {
    const key = hmoClientKey(row);
    const scheduleMonths = new Set(hmoScheduleMonths(row, hmoViewYear));
    const amount = parseCurrency(row.premium) * rateForRow(row);
    const monthCells = MONTHS.map((_, m) => {
      if(!scheduleMonths.has(m)) return `<td class="prufin-na">—</td>`;
      const paid = tracker.some(t => t.clientKey === key && t.year === hmoViewYear && t.monthIndex === m);
      return `<td><input type="checkbox" ${paid ? 'checked' : ''} onchange="toggleHmoPayment('${prufinJsStr(key)}', ${m}, this.checked)" title="${fmtCurrency(amount)}"></td>`;
    }).join('');
    return `<tr>
      <td style="text-align:left;"><span class="status-pill status-${(row.status || 'Active').replace(' ','\\ ')}">${escapeHtml(row.status || 'Active')}</span></td>
      <td style="text-align:left;">${escapeHtml(row.name || '')}</td>
      ${isAll ? `<td style="text-align:left;">${escapeHtml(row.hmo || '')}</td>` : ''}
      <td style="text-align:left;">${escapeHtml(fmtIssuedDate(row.submitted || ''))}</td>
      <td style="text-align:left;">${escapeHtml(row.mode || '')}</td>
      <td style="text-align:left;">${escapeHtml(hmoScheduleLabel(row, hmoViewYear))}</td>
      ${monthCells}
    </tr>`;
  }).join('');

  const labelColspan = isAll ? 6 : 5;
  mount.innerHTML = `
    ${rateNote}
    ${toggleHtml}
    <div class="statistics-table-wrap">
      <table class="statistics-table prufin-tracker-table">
        <thead><tr>
          <th style="text-align:left;">Status</th>
          <th style="text-align:left;">Name of Client</th>
          ${isAll ? `<th style="text-align:left;">HMO Company</th>` : ''}
          <th style="text-align:left;">Effectivity Date</th>
          <th style="text-align:left;">Mode</th>
          <th style="text-align:left;">Schedule of Payments</th>
          ${MONTHS.map(m => `<th>${m.slice(0,3)}</th>`).join('')}
        </tr>
        <tr class="prufin-tracker-totals-row">
          <th colspan="${labelColspan}" style="text-align:left; font-weight:600;">Total Commission This Month</th>
          ${monthlyTotals.map(total => `<th class="num">${total ? fmtCurrency(total) : '—'}</th>`).join('')}
        </tr>
        <tr class="prufin-tracker-totals-row prufin-tracker-received-row">
          <th colspan="${labelColspan}" style="text-align:left; font-weight:600;">Received Commission This Month</th>
          ${monthlyReceived.map(received => `<th class="num">${received ? fmtCurrency(received) : '—'}</th>`).join('')}
        </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

/* Actual PRUFINATED commission collected per calendar month of `year`:
   every scheduled payment marked Paid in the tracker, plus any manually
   entered commission for a month with no matching Issued-client payment. */
async function computePrufinActualByMonth(year){
  const clients = await getEntries('pru-clients');
  const overrides = await getEntries('prufin-rate-overrides');
  const est = computePrufinEstimate(clients, overrides, year, 'all');
  const tracker = await getEntries('prufin-payment-tracker');
  const paidSet = new Set(tracker.filter(t => t.year === year).map(t => t.clientKey + '|' + t.monthIndex));
  const byMonth = Array(12).fill(0);
  est.paymentsFlat.forEach(p => {
    if(paidSet.has(p.clientKey + '|' + p.monthIndex)) byMonth[p.monthIndex] += p.gross;
  });
  const manualEntries = await getEntries('prufin-manual-actuals');
  manualEntries.filter(m => m.year === year).forEach(m => { byMonth[m.monthIndex] += m.amount; });
  return byMonth;
}

/* Actual HUSTLES (HMO) commission received per calendar month of `year`:
   every scheduled payment, across every company, checked off in the
   Commissions payment tracker. */
async function computeHmoReceivedByMonth(year){
  const clients = await getEntries('hmo-clients');
  const overrides = await getEntries('hmo-rate-overrides');
  const tracker = await getEntries('hmo-payment-tracker');
  const byMonth = Array(12).fill(0);
  clients.forEach(row => {
    const rate = hmoRateFor(overrides, row.hmo);
    const amount = parseCurrency(row.premium) * rate;
    const key = hmoClientKey(row);
    hmoScheduleMonths(row, year).forEach(m => {
      const paid = tracker.some(t => t.clientKey === key && t.year === year && t.monthIndex === m);
      if(paid) byMonth[m] += amount;
    });
  });
  return byMonth;
}

/* -- live countdown to Jan 1, 2027, shown at the top of Rewards & Achievements -- */
let yearCountdownTimer = null;
function startYearCountdown(){
  if(yearCountdownTimer) clearInterval(yearCountdownTimer);
  function tick(){
    const el = document.getElementById('year-countdown-value');
    if(!el){ clearInterval(yearCountdownTimer); yearCountdownTimer = null; return; }
    const target = new Date(2027, 0, 1, 0, 0, 0);
    const diff = Math.max(0, target - new Date());
    const days = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    const minutes = Math.floor((diff % 3600000) / 60000);
    const seconds = Math.floor((diff % 60000) / 1000);
    el.textContent = `${days}d ${String(hours).padStart(2,'0')}h ${String(minutes).padStart(2,'0')}m ${String(seconds).padStart(2,'0')}s`;
  }
  tick();
  yearCountdownTimer = setInterval(tick, 1000);
}

/* -- Premium × Mode of Payment → APE, live in the add/edit client form --
   Annual×1, Semi-Annual×2, Quarterly×4, Monthly×12 (reuses MODE_FREQ). */
function setupApeAutoCalc(item, config){
  const hasKeys = ['premium','mode','ape'].every(k => config.columns.some(c => c.key === k));
  if(!hasKeys) return;
  const premiumEl = document.getElementById(item.id + '-f-premium');
  const modeEl = document.getElementById(item.id + '-f-mode');
  const apeEl = document.getElementById(item.id + '-f-ape');
  if(!premiumEl || !modeEl || !apeEl) return;
  function recalc(){
    const premium = parseCurrency(premiumEl.value);
    const freq = MODE_FREQ[modeEl.value];
    if(premium && freq) apeEl.value = (premium * freq).toFixed(2);
  }
  premiumEl.addEventListener('input', recalc);
  modeEl.addEventListener('change', recalc);
}

  return `<div class="whats-next-checklist">${items.map((item, index) => `<div class="whats-next-check-row ${item.done ? 'done' : ''}"><input type="checkbox" ${item.done ? 'checked' : ''} onchange="whatsNextToggle('${dateKey}','${kind}',${index})"><span>${escapeHtml(item.text || item.title || '')}</span><div class="whats-next-item-actions"><button onclick="whatsNextEdit('${dateKey}','${kind}',${index})">Edit</button><button onclick="whatsNextDelete('${dateKey}','${kind}',${index})">Remove</button></div></div>`).join('')}</div>`;
}
function whatsNextAddRow(category, dateKey, id){
  return `<div class="whats-next-add-row"><input id="${id}" type="text" placeholder="Add to ${category.toLowerCase()}"><button class="primary" onclick="whatsNextAddTask('${dateKey}','${category}','${id}')">Add</button></div>`;
}
function whatsNextCategorySection(category, day, dateKey){
  const key = whatsNextCategoryKey(category);
  return `<div class="whats-next-card card"><h2>${category}</h2><div class="sub">${WHATS_NEXT_CATEGORY_EXAMPLES[category]}</div>${whatsNextTaskRows(day[key], key, dateKey)}${whatsNextAddRow(category, dateKey, 'whats-next-' + key + '-input')}</div>`;
}
function whatsNextCalendar(record){
  const year = whatsNextMonth.getFullYear();
  const month = whatsNextMonth.getMonth();
  const first = new Date(year, month, 1);
  const start = new Date(year, month, 1 - first.getDay());
  const today = whatsNextDateKey(new Date());
  const cells = Array.from({length:42}, (_, index) => {
    const date = new Date(start.getFullYear(), start.getMonth(), start.getDate() + index);
    const key = whatsNextDateKey(date);
    const day = whatsNextNormalizeDay(record.days[key]);
    const indicators = whatsNextIndicators(day);
    return `<button class="whats-next-day ${date.getMonth() !== month ? 'muted' : ''} ${key === today ? 'today' : ''} ${key === whatsNextSelectedDate ? 'selected' : ''}" onclick="whatsNextSelectDate('${key}')"><span class="whats-next-day-number">${date.getDate()}</span>${day.rating ? `<i class="whats-next-rating ${day.rating}"></i>` : ''}<span class="whats-next-day-indicators">${indicators.map(type => `<i class="whats-next-dot ${type}"></i>`).join('')}</span></button>`;
  }).join('');
  return `<section class="whats-next-calendar card"><div class="whats-next-calendar-head"><button class="whats-next-month-button" onclick="whatsNextChangeMonth(-1)" aria-label="Previous month">←</button><h2>${MONTHS[month]} ${year}</h2><button class="whats-next-month-button" onclick="whatsNextChangeMonth(1)" aria-label="Next month">→</button></div><div class="whats-next-weekdays"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div><div class="whats-next-calendar-grid">${cells}</div></section>`;
}
function whatsNextSummary(day){
  const groups = [['Tasks completed', day.tasks], ['Money-making activities completed', day.money], ['Business-building activities completed', day.business], ['Client-care activities completed', day.client], ['Life-building activities completed', day.life], ['Maintenance completed', day.maintenance], ['Habits completed', day.habits]];
  const optional = [];
  if(day.income) optional.push(`<div>Income generated<strong>${escapeHtml(day.income)}</strong></div>`);
  if(day.people) optional.push(`<div>People helped<strong>${escapeHtml(day.people)}</strong></div>`);
  return groups.map(([label, items]) => `<div>${label}<strong>${items.filter(item => item.done).length}</strong></div>`).join('') + optional.join('');
}
function whatsNextWorkspace(day, dateKey){
  const top3 = day.top3.map((item, index) => `<div class="whats-next-check-row ${item.done ? 'done' : ''}"><input type="checkbox" ${item.done ? 'checked' : ''} onchange="whatsNextToggleTop3('${dateKey}',${index})"><input type="text" value="${escapeHtml(item.text)}" placeholder="Priority ${index + 1}" onblur="whatsNextSaveTop3('${dateKey}')"></div>`).join('');
  const events = day.events.length ? day.events.map((event, index) => `<div class="whats-next-event"><span><strong>${escapeHtml(event.title)}</strong><br><small>${escapeHtml(event.time || '')}${event.notes ? ' · ' + escapeHtml(event.notes) : ''}</small></span><button class="row-del" onclick="whatsNextDelete('${dateKey}','events',${index})">Remove</button></div>`).join('') : '<div class="whats-next-empty">No events for this day.</div>';
  const notes = day.notes || {};
  return `<div class="whats-next-workspace"><div class="whats-next-main"><section class="whats-next-card card"><div class="whats-next-date">${whatsNextDateLabel(dateKey)}</div><h2>Day Rating</h2><div class="sub">This describes your capacity and experience, not your productivity or success.</div><div class="whats-next-rating-options">${WHATS_NEXT_RATINGS.map(([key, label, description]) => `<button class="whats-next-rating-option ${key} ${day.rating === key ? 'active' : ''}" onclick="whatsNextSetRating('${dateKey}','${key}')">${label} · ${description}</button>`).join('')}</div></section><section class="whats-next-card card"><h2>Top 3</h2><div class="sub">What matters most today.</div><div class="whats-next-checklist">${top3}</div></section><section class="whats-next-card card"><h2>To-do List</h2><div class="sub">Tasks are things you finish. Add a category or make your own.</div>${whatsNextTaskRows(day.tasks, 'tasks', dateKey)}<div class="whats-next-add-row"><input id="whats-next-task-input" type="text" placeholder="Add a task"><select id="whats-next-task-category"><option value="">No category</option>${WHATS_NEXT_CATEGORIES.map(category => `<option>${category}</option>`).join('')}</select><button class="primary" onclick="whatsNextAddTask('${dateKey}','tasks','whats-next-task-input')">Add</button></div></section>${whatsNextCategorySection('MONEY-MAKING', day, dateKey)}${whatsNextCategorySection('BUSINESS-BUILDING', day, dateKey)}${whatsNextCategorySection('CLIENT CARE', day, dateKey)}${whatsNextCategorySection('LIFE-BUILDING', day, dateKey)}${whatsNextCategorySection('MAINTENANCE', day, dateKey)}</div><div class="whats-next-side"><section class="whats-next-card card"><div class="whats-next-quick-add"><button class="primary" onclick="whatsNextQuickAdd('task')">+ Task</button><button class="primary" onclick="whatsNextQuickAdd('event')">+ Event</button><button class="primary" onclick="whatsNextQuickAdd('note')">+ Note</button><button class="primary" onclick="whatsNextQuickAdd('habit')">+ Habit</button><button class="primary" onclick="whatsNextQuickAdd('money')">+ Money-Making Activity</button></div><h2>Events</h2><div class="whats-next-events">${events}</div></section><section class="whats-next-card card"><h2>Habits</h2><div class="sub">Habits are things you practice, not tasks to finish.</div>${whatsNextTaskRows(day.habits, 'habits', dateKey)}${whatsNextAddRow('habit', dateKey, 'whats-next-habit-input')}</section><section class="whats-next-card card"><h2>Daily Notes / Journal</h2><div class="whats-next-notes"><label>How am I feeling?<textarea id="whats-next-feeling">${escapeHtml(notes.feeling)}</textarea></label><label>What happened today?<textarea id="whats-next-happened">${escapeHtml(notes.happened)}</textarea></label><label>What worked?<textarea id="whats-next-worked">${escapeHtml(notes.worked)}</textarea></label><label>What didn't?<textarea id="whats-next-didnt">${escapeHtml(notes.didnt)}</textarea></label><label>What do I want to remember?<textarea id="whats-next-remember">${escapeHtml(notes.remember)}</textarea></label><label>What's next?<textarea id="whats-next-next">${escapeHtml(notes.next)}</textarea></label><label>Income generated (optional)<input id="whats-next-income" type="text" value="${escapeHtml(day.income)}" placeholder="Optional amount or note"></label><label>People helped (optional)<input id="whats-next-people" type="text" value="${escapeHtml(day.people)}" placeholder="Optional count or note"></label><button class="primary" onclick="whatsNextSaveNotes('${dateKey}')">Save notes</button></div></section><section class="whats-next-card card"><h2>Daily Summary</h2><div class="whats-next-summary">${whatsNextSummary(day)}</div></section></div></div>`;
}
async function renderWhatsNextPanel(){
  const panel = document.getElementById('leaf-whats-next');
  if(!panel) return;
  const { record } = await whatsNextRecord();
  const day = whatsNextNormalizeDay(record.days[whatsNextSelectedDate]);
  panel.innerHTML = `<div class="whats-next-panel"><button class="back-link" onclick="backToGrid()">← WHAT'S NEXT</button><div class="whats-next-head"><div><h1>WHAT'S NEXT</h1><div class="sub">What matters today. What's next. What can wait.</div></div><div class="whats-next-today">Today · ${new Date().toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' })}</div></div>${whatsNextCalendar(record)}${whatsNextWorkspace(day, whatsNextSelectedDate)}</div>`;
}
async function whatsNextUpdateDay(dateKey, updater){
  const { record, records } = await whatsNextRecord();
  const day = whatsNextNormalizeDay(record.days[dateKey]);
  updater(day);
  record.days[dateKey] = day;
  await whatsNextSave(record, records);
  await renderWhatsNextPanel();
}
async function whatsNextSelectDate(dateKey){
  whatsNextSelectedDate = dateKey;
  const date = new Date(dateKey + 'T00:00:00');
  whatsNextMonth = new Date(date.getFullYear(), date.getMonth(), 1);
  await renderWhatsNextPanel();
}
async function whatsNextChangeMonth(offset){
  whatsNextMonth = new Date(whatsNextMonth.getFullYear(), whatsNextMonth.getMonth() + offset, 1);
  await renderWhatsNextPanel();
}
async function whatsNextSetRating(dateKey, rating){ await whatsNextUpdateDay(dateKey, day => { day.rating = rating; }); }
async function whatsNextToggle(dateKey, kind, index){ await whatsNextUpdateDay(dateKey, day => { if(day[kind]?.[index]) day[kind][index].done = !day[kind][index].done; }); }
async function whatsNextToggleTop3(dateKey, index){ await whatsNextUpdateDay(dateKey, day => { day.top3[index].done = !day.top3[index].done; }); }
async function whatsNextSaveTop3(dateKey){
  const inputs = [...document.querySelectorAll('.whats-next-main input[type="text"]')].slice(0, 3);
  await whatsNextUpdateDay(dateKey, day => { day.top3 = inputs.map((input, index) => ({ text:input.value.trim(), done:day.top3[index]?.done || false })); });
}
async function whatsNextAddTask(dateKey, category, inputId){
  const input = document.getElementById(inputId);
  const text = input?.value.trim();
  if(!text) return;
  const target = category === 'tasks' ? 'tasks' : whatsNextCategoryKey(category);
  await whatsNextUpdateDay(dateKey, day => { day[target].push({ id:Date.now() + Math.random(), text, done:false, category:category === 'tasks' ? document.getElementById('whats-next-task-category')?.value || '' : category }); });
}
async function whatsNextEdit(dateKey, kind, index){
  const { record, records } = await whatsNextRecord();
  const day = whatsNextNormalizeDay(record.days[dateKey]);
  const item = day[kind]?.[index];
  if(!item) return;
  const text = prompt('Edit item', item.text || '');
  if(text === null || !text.trim()) return;
  item.text = text.trim();
  record.days[dateKey] = day;
  await whatsNextSave(record, records);
  await renderWhatsNextPanel();
}
async function whatsNextDelete(dateKey, kind, index){
  await whatsNextUpdateDay(dateKey, day => { day[kind].splice(index, 1); });
}
async function whatsNextSaveNotes(dateKey){
  const ids = ['feeling','happened','worked','didnt','remember','next'];
  await whatsNextUpdateDay(dateKey, day => { ids.forEach(id => { day.notes[id] = document.getElementById('whats-next-' + id).value.trim(); }); day.income = document.getElementById('whats-next-income').value.trim(); day.people = document.getElementById('whats-next-people').value.trim(); });
}
async function whatsNextQuickAdd(type){
  const dateKey = whatsNextSelectedDate;
  if(type === 'task'){ document.getElementById('whats-next-task-input')?.focus(); return; }
  if(type === 'note'){ document.getElementById('whats-next-feeling')?.focus(); return; }
  if(type === 'habit'){ document.getElementById('whats-next-habit-input')?.focus(); return; }
  if(type === 'money'){ document.getElementById('whats-next-money-input')?.focus(); return; }
  const title = prompt('Event name');
  if(!title?.trim()) return;
  const time = prompt('Time or details (optional)', '') || '';
  await whatsNextUpdateDay(dateKey, day => { day.events.push({ title:title.trim(), time, notes:'', id:Date.now() + Math.random() }); });
}

GROUPS.forEach(g => {
  g.items.forEach(item => {
    if(item.url) return; // link-only items (Sites) have no leaf panel
    const tableConfig = TABLE_LEAVES[item.id];
    let panel;
    if(item.id === 'pru-rewards'){
      panel = buildRewardsPanel(item, g.label);
    }else if(item.id === 'prufin'){
      panel = buildPrufinPanel(item, g.label);
    }else if(item.id === 'hmo-commissions'){
      panel = buildHmoCommissionsPanel(item, g.label);
    }else if(item.id === 'money-income'){
      panel = buildMoneyIncomePanel(item, g.label);
    }else if(item.id === 'whats-next'){
      panel = document.createElement('div');
      panel.className = 'leaf-view';
      panel.id = 'leaf-whats-next';
    }else if(item.id === 'pru-servicing'){
      panel = buildServicingPanel(item, g.label);
    }else if(tableConfig && tableConfig.lead){
      panel = buildLeadPanel(item, g.label, tableConfig);
    }else if(tableConfig){
      panel = buildTablePanel(item, g.label, tableConfig);
    }else{
      panel = buildGenericPanel(item, g.label);
    }
    leafMount.appendChild(panel);
    if(tableConfig) setupApeAutoCalc(item, tableConfig);
  });
});

function statisticsTable(rows){
  if(!rows.length) return '<div class="statistics-table-wrap"><div class="statistics-empty">No issued clients recorded.</div></div>';
  return `<div class="statistics-table-wrap"><table class="statistics-table"><thead><tr><th>Plan Type</th><th>Clients</th><th>APE</th><th>Average APE</th></tr></thead><tbody>${rows.map(row => `<tr><td>${escapeHtml(row.plan)}</td><td class="num">${row.clients}</td><td class="num">${fmtCurrency(row.ape)}</td><td class="num">${fmtCurrency(row.clients ? row.ape / row.clients : 0)}</td></tr>`).join('')}</tbody></table></div>`;
}

async function renderStatisticsPanel(){
  if(!statisticsMount) return;
  const clients = await getEntries('pru-clients');
  const today = new Date();
  const currentYear = today.getFullYear();
  const months = [...MONTHS];
  const rows = clients.filter(row => !row.status || String(row.status).toLowerCase() === 'issued').map(row => ({
    ...row,
    statsDate: submittedDateFromMonth(row.submitted, currentYear),
  })).filter(row => row.statsDate);
  const own = rows.filter(row => (row.clientType || 'Own') === 'Own');
  const adopted = rows.filter(row => (row.clientType || 'Own') === 'Adopted');
  const ownYtd = own.filter(row => row.statsDate.getFullYear() === currentYear && row.statsDate <= today);
  const average = values => values.length ? values.reduce((sum, value) => sum + value, 0) / values.length : 0;
  const totalApe = list => list.reduce((sum, row) => sum + parseCurrency(row.ape), 0);
  const planRows = list => {
    const grouped = {};
    list.forEach(row => {
      const plan = row.plan || 'Unspecified';
      if(!grouped[plan]) grouped[plan] = { plan, clients:0, ape:0 };
      grouped[plan].clients += 1;
      grouped[plan].ape += parseCurrency(row.ape);
    });
    return Object.values(grouped).sort((a, b) => b.ape - a.ape);
  };
  const monthly = months.map((month, index) => {
    const monthRows = ownYtd.filter(row => row.statsDate.getMonth() === index);
    return { month, clients: monthRows.length, ape: totalApe(monthRows) };
  });
  const activeMonths = monthly.filter(row => row.clients > 0);
  const yearly = {};
  own.forEach(row => {
    const year = row.statsDate.getFullYear();
    if(!yearly[year]) yearly[year] = { year, clients:0, ape:0 };
    yearly[year].clients += 1;
    yearly[year].ape += parseCurrency(row.ape);
  });
  const yearlyRows = Object.values(yearly).sort((a, b) => b.year - a.year);
  const yearlyByYear = Object.fromEntries(yearlyRows.map(row => [row.year, row]));
  yearlyRows.forEach(row => {
    const previous = yearlyByYear[row.year - 1];
    row.growth = previous && previous.ape > 0 ? ((row.ape - previous.ape) / previous.ape) * 100 : null;
  });
  const chartBars = (list, labelKey, valueKey, formatter) => {
    if(!list.length) return '<div class="statistics-empty">No data to chart.</div>';
    const maximum = Math.max(...list.map(row => row[valueKey]), 1);
    return `<div class="statistics-bar-list">${list.map(row => `<div class="statistics-bar-row"><div class="statistics-bar-label">${escapeHtml(row[labelKey])}</div><div class="statistics-bar-track"><div class="statistics-bar-fill" style="width:${(row[valueKey] / maximum) * 100}%"></div></div><div class="statistics-bar-value">${formatter(row[valueKey])}</div></div>`).join('')}</div>`;
  };
  const ownApe = totalApe(own);
  const adoptedApe = totalApe(adopted);
  const combinedApe = ownApe + adoptedApe;
  const ownShare = combinedApe ? (ownApe / combinedApe) * 360 : 0;
  const rewardApeRows = own.filter(row => row.statsDate.getFullYear() === 2026);
  const rewardApe = totalApe(rewardApeRows);
  const rewardLadder = ACHIEVEMENTS.filter(item => item.basis !== 'fyp').sort((a, b) => a.threshold - b.threshold);
  const achievedRewards = rewardLadder.filter(item => rewardApe >= item.threshold);
  const nextReward = rewardLadder.find(item => rewardApe < item.threshold);
  const highestReward = achievedRewards[achievedRewards.length - 1];
  const travelDeadline = TRAVEL_INCENTIVES[0]?.deadline || '2026-11-30';
  const travelDeadlineLabel = new Date(travelDeadline + 'T00:00:00').toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' });
  const mdrtDeadlineLabel = 'December 31, 2026';
  const assessment = nextReward
    ? `Your 2026 issued production is ${fmtCurrency(rewardApe)} APE. You have reached ${highestReward ? highestReward.label : 'the starting line'} and are ${fmtCurrency(Math.max(0, nextReward.threshold - rewardApe))} away from ${nextReward.label}. Do not wait for motivation: schedule the next conversations, follow up daily, and track issued Own production every week.`
    : `Your 2026 issued production is ${fmtCurrency(rewardApe)} APE, beyond the ${highestReward.label} milestone. Sustain the pace, protect your quality standard, and keep building toward the FYP-based MDRT goal.`;
  const assessmentNotes = `Strict notes: South Korea production is counted only from August through November and the travel deadline is ${travelDeadlineLabel}. MDRT qualification is FYP-based and must be secured by ${mdrtDeadlineLabel}. A goal without weekly issued production, follow-ups, and documented next actions is only a wish.`;
  statisticsMount.innerHTML = `
    <button class="statistics-back" onclick="closeStatistics()">← Back to dashboard</button>
    <h1>Statistics</h1>
    <div class="sub">Issued client production, plan mix, and own-client performance.</div>
    <h2>Statistics for Own &amp; Adopted</h2>
    <div class="stats-sub">Issued clients only. Lapsed clients are excluded.</div>
    <div class="statistics-grid">
      <div class="statistics-card"><h3>Own</h3><div class="statistics-values"><div><div class="statistics-label">Clients</div><div class="statistics-value">${own.length}</div></div><div><div class="statistics-label">APE</div><div class="statistics-value">${fmtCurrency(totalApe(own))}</div></div><div><div class="statistics-label">Avg APE</div><div class="statistics-value">${fmtCurrency(average(own.map(row => parseCurrency(row.ape))))}</div></div></div></div>
      <div class="statistics-card"><h3>Adopted</h3><div class="statistics-values"><div><div class="statistics-label">Clients</div><div class="statistics-value">${adopted.length}</div></div><div><div class="statistics-label">APE</div><div class="statistics-value">${fmtCurrency(totalApe(adopted))}</div></div><div><div class="statistics-label">Avg APE</div><div class="statistics-value">${fmtCurrency(average(adopted.map(row => parseCurrency(row.ape))))}</div></div></div></div>
    </div>
    <div class="statistics-chart-grid">
      <div class="statistics-chart-card"><h3>APE by Client Type</h3><div class="statistics-pie" style="background:conic-gradient(var(--brass) 0deg ${ownShare}deg, var(--navy) ${ownShare}deg 360deg);"></div><div class="statistics-legend"><span><i class="statistics-swatch" style="background:var(--brass)"></i>Own ${combinedApe ? ((ownApe / combinedApe) * 100).toFixed(1) : '0.0'}%</span><span><i class="statistics-swatch" style="background:var(--navy)"></i>Adopted ${combinedApe ? ((adoptedApe / combinedApe) * 100).toFixed(1) : '0.0'}%</span></div></div>
      <div class="statistics-chart-card"><h3>APE by Plan Type (Own)</h3>${chartBars(planRows(own), 'plan', 'ape', fmtCurrency)}</div>
    </div>
    <h2>Plan Types</h2>
    <div class="stats-sub">Plan mix for Own and Adopted issued clients.</div>
    <h3>Own</h3>${statisticsTable(planRows(own))}
    <h3>Adopted</h3>${statisticsTable(planRows(adopted))}
    <h2>Own Client Performance</h2>
    <div class="stats-sub">Current year is ${currentYear}. Monthly averages use months with at least one Own client.</div>
    <div class="statistics-grid">
      <div class="statistics-card"><div class="statistics-label">Average No. of Clients per Month</div><div class="statistics-value">${average(activeMonths.map(row => row.clients)).toFixed(1)}</div><div class="statistics-note">${activeMonths.length} active month${activeMonths.length === 1 ? '' : 's'}</div></div>
      <div class="statistics-card"><div class="statistics-label">Average APE Size per Month</div><div class="statistics-value">${fmtCurrency(average(activeMonths.map(row => row.ape)))}</div><div class="statistics-note">Average monthly Own APE</div></div>
      <div class="statistics-card"><div class="statistics-label">Average APE Size YTD</div><div class="statistics-value">${fmtCurrency(average(ownYtd.map(row => parseCurrency(row.ape))))}</div><div class="statistics-note">Average per Own client</div></div>
      <div class="statistics-card"><div class="statistics-label">Own APE YTD</div><div class="statistics-value">${fmtCurrency(totalApe(ownYtd))}</div><div class="statistics-note">${ownYtd.length} Own client${ownYtd.length === 1 ? '' : 's'}</div></div>
    </div>
    <h2>Production per Year (Own)</h2>
    <div class="stats-sub">Own issued client count and APE by production year.</div>
    <div class="statistics-chart-card"><h3>Yearly Own APE</h3>${chartBars(yearlyRows, 'year', 'ape', fmtCurrency)}</div>
    <div class="statistics-table-wrap"><table class="statistics-table"><thead><tr><th>Year</th><th>Clients</th><th>Total APE</th><th>Average APE</th><th>Growth</th></tr></thead><tbody>${yearlyRows.length ? yearlyRows.map(row => `<tr><td>${row.year}</td><td class="num">${row.clients}</td><td class="num">${fmtCurrency(row.ape)}</td><td class="num">${fmtCurrency(row.ape / row.clients)}</td><td class="num">${row.growth == null ? 'New' : `${row.growth >= 0 ? '+' : ''}${row.growth.toFixed(1)}%`}</td></tr>`).join('') : '<tr><td colspan="5" class="statistics-empty">No production data yet.</td></tr>'}</tbody></table></div>
    <h2>Own Monthly Production - ${currentYear}</h2>
    <div class="statistics-table-wrap"><table class="statistics-table"><thead><tr><th>Month</th><th>Clients</th><th>APE</th><th>Average APE</th></tr></thead><tbody>${monthly.map(row => `<tr><td>${row.month}</td><td class="num">${row.clients}</td><td class="num">${fmtCurrency(row.ape)}</td><td class="num">${fmtCurrency(row.clients ? row.ape / row.clients : 0)}</td></tr>`).join('')}</tbody></table></div>
    <div class="statistics-assessment"><h2>2026 Sales Assessment</h2><p>${assessment}</p><p class="statistics-note">${assessmentNotes}</p></div>
  `;
}

    return;
  }
  if(homePanel) homePanel.style.display = 'none';
  if(prufinStatsOpen && (activeGroup !== 'pru' || activeLeaf !== 'prufin')){
    prufinStatsOpen = false;
  }
  if(prufinStatsOpen){
    boxGrid.style.display = 'none';
    document.getElementById('group-title').style.display = 'none';
    document.getElementById('group-sub').style.display = 'none';
    document.querySelectorAll('.leaf-view').forEach(p => p.classList.remove('visible'));
    statisticsMount.classList.remove('visible');
    if(prufinStatisticsMount) prufinStatisticsMount.classList.add('visible');
    return;
  }
  if(prufinStatisticsMount) prufinStatisticsMount.classList.remove('visible');
  if(statisticsOpen){
    boxGrid.style.display = 'none';
    document.getElementById('group-title').style.display = 'none';
    document.getElementById('group-sub').style.display = 'none';
    document.querySelectorAll('.leaf-view').forEach(p => p.classList.remove('visible'));
    statisticsMount.classList.add('visible');
    return;
  }
  statisticsMount.classList.remove('visible');
  const showGrid = activeLeaf === null;
  boxGrid.style.display = showGrid ? 'grid' : 'none';
  document.getElementById('group-title').style.display = showGrid ? 'block' : 'none';
  document.getElementById('group-sub').style.display = showGrid ? 'block' : 'none';
  document.querySelectorAll('.leaf-view').forEach(p => p.classList.remove('visible'));
  if(!showGrid){
    document.getElementById('leaf-' + activeLeaf).classList.add('visible');
  }
}

// Restarts the "view-enter" CSS animation on an element even if it already
// has the class, by removing it, forcing a reflow, then re-adding it.
function playEnterAnimation(el){
  if(!el) return;
  el.classList.remove('view-enter');
  void el.offsetWidth;
  el.classList.add('view-enter');
}

const leadSortState = {};

function leadDateValue(row){
  return row.contactStarted ? new Date(row.contactStarted + 'T00:00:00') : row.dateAdded ? new Date(row.dateAdded) : new Date(row.ts || 0);
}
function leadDateLabel(row){
  const date = leadDateValue(row);
  return date.getTime() ? date.toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' }) : '';
}
function leadDaysSince(row){
  const date = leadDateValue(row);
  if(!date.getTime()) return '';
  return Math.max(0, Math.floor((Date.now() - date.getTime()) / 86400000));
}
function leadRemark(status){
  return status === 'App Submitted' || status === 'Issued' ? 'Nurture Client' : 'Followup';
}
function nextLeadMove(lastMove){
  if(lastMove === 'Push') return 'Pull';
  if(lastMove === 'Pull') return 'Push';
  return '';
}
function nurtureFocus(days){
  if(days <= 1) return { move:'Push', text:'Start & discover' };
  if(days === 2) return { move:'Pull', text:'Give space' };
  if(days === 3) return { move:'Push', text:'Educate' };
  if(days === 4) return { move:'Pull', text:'' };
  if(days === 5) return { move:'Push', text:'Invite to assessment' };
  if(days === 6) return { move:'Pull', text:'' };
  if(days === 7) return { move:'Push', text:'Give value' };
  if(days === 8) return { move:'Pull', text:'' };
  if(days <= 10) return { move:'Push', text:'Build trust + recommend' };
  if(days === 11) return { move:'Pull', text:'Let them think' };
  if(days === 12) return { move:'Push', text:'Ask for decision' };
  if(days === 13) return { move:'Pull', text:'Remove pressure' };
  return { move:'Both', text:'Close the loop' };
}
function nurtureFocusHtml(row){
  const focus = nurtureFocus(leadDaysSince(row));
  if(focus.move === 'Both') return `<span class="move-badge move-push">PUSH</span><span class="move-badge move-pull">PULL</span> — ${focus.text}`;
  return `${moveBadge(focus.move)}${focus.text ? ` — ${focus.text}` : ''}`;
}
function moveBadge(move){
  if(!move) return '<span class="lead-detail-value empty">Not set</span>';
  const className = move.toLowerCase() === 'push' ? 'move-push' : 'move-pull';
  return `<span class="move-badge ${className}">${move}</span>`;
}
function needsNurture(row){
  const days = leadDaysSince(row);
  return days !== '' && days >= 0 && days <= 14;
}
function needsLongTermNurture(row){
  const days = leadDaysSince(row);
  return days !== '' && days >= 15;
}

async function addLeadRow(id){

async function moveIssuedLeadToServicing(lead){
  const servicing = await getEntries('pru-servicing');
  const sourceKey = lead.ts || `${lead.name}|${lead.contactStarted || ''}`;
  if(servicing.some(client => client.sourceLeadKey === sourceKey)) return;
  servicing.push({
    ...lead,
    name: lead.name,
    issuedDate: lead.contactStarted || new Date().toISOString().slice(0, 10),
    servicingType: 'Own',
    status: 'Issued',
    notes: `Moved from Pru Leads${lead.lastContact ? ` · Last contact ${lead.lastContact}` : ''}`,
    sourceLeadKey: sourceKey,
    ts: Date.now()
  });
  await saveEntries('pru-servicing', servicing);
  const leads = await getEntries('pru-leads');
  const index = leads.findIndex(item => (item.ts || `${item.name}|${item.contactStarted || ''}`) === sourceKey);
  if(index >= 0){ leads.splice(index, 1); await saveEntries('pru-leads', leads); }
}
async function migrateExistingIssuedLeads(){
  const leads = await getEntries('pru-leads');
  const issued = leads.filter(row => row.status === 'Issued');
  for(const lead of issued) await moveIssuedLeadToServicing(lead);
}
async function syncClientsToServicing(){
  const clients = await getEntries('pru-clients');
  const servicing = await getEntries('pru-servicing');
  let changed = false;
  for(const client of clients){
    const sourceKey = client.ts || `${client.name}|${client.submitted || ''}`;
    const existing = servicing.find(entry =>
      entry.sourceClientKey === sourceKey ||
      (!entry.sourceClientKey && entry.name === client.name && (entry.issuedDate || entry.submitted || '') === (client.submitted || ''))
    );
    if(existing){
      Object.assign(existing, client, {
        issuedDate: client.submitted || '',
        servicingType: client.clientType || existing.servicingType || 'Own',
        sourceClientKey: sourceKey
      });
      changed = true;
      continue;
    }
    servicing.push({
      ...client,
      issuedDate: client.submitted || '',
      servicingType: client.clientType || 'Own',
      sourceClientKey: sourceKey,
      ts: Date.now() + Math.random()
    });
    changed = true;
  }
  if(changed) await saveEntries('pru-servicing', servicing);
}
async function syncServicingToClients(){
  const servicing = await getEntries('pru-servicing');
  const clients = await getEntries('pru-clients');
  let changed = false;
  for(const service of servicing.filter(row => row.status === 'Issued')){
    const sourceKey = service.sourceClientKey || service.sourceLeadKey || `servicing:${service.ts || `${service.name}|${service.issuedDate || ''}`}`;
    const existing = clients.find(client => client.sourceServicingKey === sourceKey || client.ts === service.ts || (client.name === service.name && (client.submitted || '') === (service.issuedDate || '')));
    const clientData = {
      ...service,
      name: service.name || '',
      submitted: service.issuedDate || service.submitted || '',
      status: 'Issued',
      clientType: service.servicingType || service.clientType || 'Own',
      sourceServicingKey: sourceKey,
      ts: existing?.ts || Date.now() + Math.random()
    };
    if(existing) Object.assign(existing, clientData);
    else clients.push(clientData);
    changed = true;
  }
  if(changed) await saveEntries('pru-clients', clients);
}

async function renderTable(id){
  const config = TABLE_LEAVES[id];
  const allEntries = await getEntries(id);
  const entries = id === 'pru-clients' && clientYearFilter !== 'all'
    ? allEntries.filter(row => {

      })

  const fypAsOfDate = new Date();
