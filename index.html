      </div>
    </div>

    <div class="statistics-grid">
      <div class="statistics-card"><h3>Estimated ${prufinStatsYear}</h3><div class="statistics-values"><div><div class="statistics-label">Gross</div><div class="statistics-value">${fmtCurrency(estGross)}</div></div><div><div class="statistics-label">Net</div><div class="statistics-value">${fmtCurrency(estNet)}</div></div></div></div>
      <div class="statistics-card"><h3>Actual ${prufinStatsYear}</h3><div class="statistics-values"><div><div class="statistics-label">Gross</div><div class="statistics-value">${fmtCurrency(actualGross)}</div></div><div><div class="statistics-label">Net</div><div class="statistics-value">${fmtCurrency(actualNet)}</div></div></div></div>
      <div class="statistics-card"><h3>Collected</h3><div class="statistics-values"><div><div class="statistics-label">% of Estimated Gross</div><div class="statistics-value">${collectionRate.toFixed(1)}%</div></div></div></div>

async function openRewardBreakdown(kind, key){
  const modal = document.getElementById('client-fyp-modal');
  const list = document.getElementById('client-fyp-list');
  if(!modal || !list) return;
  const clients = await getEntries('pru-clients');
  const issued = clients.filter(row => row.status === 'Issued' && (row.clientType || 'Own') !== 'Adopted');
  const reward = [...ACHIEVEMENTS, ...TRAVEL_INCENTIVES, ...MDRT_MEETINGS].find(item => item.key === key);
  const isFyp = kind === 'mdrt' || key === 'mdrt';
  const fypAsOfDate = new Date();
  const qualifying = issued
    .filter(row => {
      if(isFyp) return clientFYP(row, fypAsOfDate) > 0;
      const issuedDate = submittedDateFromMonth(row.submitted, 2026);
      if(!isIssuedIn2026(row)) return false;
      return key === 'skorea'
        ? issuedDate && SKOREA_WINDOW_MONTHS.includes(MONTHS[issuedDate.getMonth()])
        : true;
    })
    .sort((a, b) => {
      const aDate = submittedDateFromMonth(a.submitted, 2026);
      const bDate = submittedDateFromMonth(b.submitted, 2026);
      return (aDate ? aDate.getTime() : 0) - (bDate ? bDate.getTime() : 0);
    });
  const title = reward ? reward.label : 'Reward Breakdown';
  const basis = isFyp ? 'FYP' : 'APE';
  list.innerHTML = qualifying.length
    ? `<table class="client-fyp-table">
        <thead><tr><th>Client Name</th><th>Issued Date</th><th>APE</th><th>FYP</th><th>Counted ${basis}</th></tr></thead>
        <tbody>${qualifying.map(row => `
          <tr>
            <td>${escapeHtml(row.name || 'Unnamed client')}</td>
            <td>${escapeHtml(fmtIssuedDate(row.submitted || ''))}</td>
            <td class="num">${fmtCurrency(parseCurrency(row.ape))}</td>
            <td class="num">${fmtCurrency(clientFYP(row, fypAsOfDate))}</td>
            <td class="num">${fmtCurrency(isFyp ? clientFYP(row, fypAsOfDate) : parseCurrency(row.ape))}</td>
          </tr>`).join('')}</tbody>
      </table>`
    : '<div class="client-fyp-empty">No Issued 2026 Clients count toward this reward yet.</div>';
  document.getElementById('client-fyp-title').textContent = title + ' · Client Breakdown';
  document.querySelector('#client-fyp-modal .client-fyp-head p').textContent = `Clients counted by ${basis} for this reward.`;
  modal.classList.add('open');

/* ==================== HMO COMMISSIONS (Hustles) ====================
   A per-company payment tracker for hmo-clients: each company has its own
   table of clients, one column per calendar month, and a checkbox on any
   month that lands on that client's payment schedule (derived from their
   Effectivity Date + Mode). Ticking a box marks that installment's
   commission as received. Rates are a single flat percent per company,
   editable in the "Commission Rate Schedule" tab above the tables. */
let hmoActiveCompany = HMO_COMPANIES[0];
let hmoViewYear = Math.max(new Date().getFullYear(), HMO_RATE_YEARS[0]);
let hmoSortMode = 'name-asc';
let hmoShowClients = false; // Commissions client table hidden by default, like Issued Clients

function hmoClientKey(row){
  return 'nm:' + String(row.name || '').trim().toLowerCase() + '|' + String(row.submitted || '').trim() + '|' + String(row.hmo || '').trim();
}
/* Every calendar month (0-11) in `year` on which a commission-bearing
   payment is scheduled, given the client's Effectivity Date and Mode —
   starting at the effectivity month and repeating every (12 / frequency)
   months. Nothing is scheduled before the effectivity date, and nothing
   after the month the client went Inactive (if any). */
function hmoScheduleMonths(row, year){
  const freq = HMO_MODE_FREQ[row.mode];
  const effDate = /^\d{4}-\d{2}-\d{2}$/.test(String(row.submitted || '')) ? new Date(row.submitted + 'T00:00:00') : null;
  if(!freq || !effDate || isNaN(effDate.getTime())) return [];
  const stepMonths = 12 / freq;
  const effTotal = effDate.getFullYear() * 12 + effDate.getMonth();
  let cutoffTotal = Infinity;
  if(String(row.status || '').toLowerCase() === 'inactive' && /^\d{4}-\d{2}$/.test(String(row.inactiveSince || ''))){
    const [iy, im] = row.inactiveSince.split('-').map(Number);
    cutoffTotal = iy * 12 + (im - 1);
  }
  const months = [];
  for(let m = 0; m < 12; m++){
    const total = year * 12 + m;
    if(total < effTotal || total > cutoffTotal) continue;
    if((total - effTotal) % stepMonths === 0) months.push(m);
  }
  return months;
}
function hmoScheduleLabel(row, year){
  const months = hmoScheduleMonths(row, year);
  return months.length ? months.map(m => MONTHS[m].slice(0,3)).join(', ') : (HMO_MODE_FREQ[row.mode] ? '—' : 'Set Mode & Effectivity Date');
}
function hmoRateFor(overrides, company){
  const found = (overrides || []).find(o => o.company === company);
  return found ? found.rate : 0;
}

async function saveHmoRates(){
  const overrides = HMO_COMPANIES.map(c => {

    return { company: c, rate: isNaN(v) ? 0 : v / 100 };
  });
  const ok = await saveEntries('hmo-rate-overrides', overrides);

/* ---- Highlights + per-company tables ---- */
async function renderHmoHighlights(clients, overrides, tracker){
  const mount = document.getElementById('hmo-highlights');
  if(!mount) return;
  const today = new Date();
  const asOfIdx = hmoViewYear < today.getFullYear() ? 11
    : hmoViewYear > today.getFullYear() ? -1
    : today.getMonth();
  let ytdTotal = 0, ytdReceived = 0;
  clients.forEach(row => {
    const rate = hmoRateFor(overrides, row.hmo);
    const amount = parseCurrency(row.premium) * rate;
    hmoScheduleMonths(row, hmoViewYear).forEach(m => {
      if(m > asOfIdx) return;
      ytdTotal += amount;
      const paid = tracker.some(t => t.clientKey === hmoClientKey(row) && t.year === hmoViewYear && t.monthIndex === m);
      if(paid) ytdReceived += amount;
    });
  });
  const ytdToGo = ytdTotal - ytdReceived;
  mount.innerHTML = `
    <div class="prufin-highlight-grid">
      <div class="prufin-highlight-box">
        <div class="phb-label">YTD Total Commissions</div>
        <div class="phb-value">${fmtCurrency(ytdTotal)}</div>
      </div>
      <div class="prufin-highlight-box">
        <div class="phb-label">YTD Received Commissions</div>
        <div class="phb-value">${fmtCurrency(ytdReceived)}</div>
      </div>
      <div class="prufin-highlight-box">
        <div class="phb-label">YTD Commissions To-Go</div>
        <div class="phb-value">${fmtCurrency(ytdToGo)}</div>
      </div>
    </div>
  `;
}

  if(checked) filtered.push({ clientKey, year: hmoViewYear, monthIndex });
  await saveEntries('hmo-payment-tracker', filtered);
  await renderHmoCommissionsPanel();
}

async function renderHmoCompanyTable(clients, overrides, tracker){
  const mount = document.getElementById('hmo-company-mount');
  if(!mount) return;
  const isAll = hmoActiveCompany === 'All';
  const companyClients = isAll ? clients : clients.filter(row => (row.hmo || '') === hmoActiveCompany);
  const sorted = [...companyClients].sort((a, b) => {
    if(hmoSortMode === 'date-asc'){
      const aT = a.submitted ? new Date(a.submitted).getTime() : 0;
      const bT = b.submitted ? new Date(b.submitted).getTime() : 0;
      return aT - bT;
    }
    if(hmoSortMode === 'status-asc') return (a.status || 'Active').localeCompare(b.status || 'Active');
    return (a.name || '').toLowerCase().localeCompare((b.name || '').toLowerCase());
  });
  const flatRate = isAll ? null : hmoRateFor(overrides, hmoActiveCompany);
  const rateForRow = row => isAll ? hmoRateFor(overrides, row.hmo) : flatRate;

  const toggleHtml = `<button class="toggle-pill-btn" onclick="toggleHmoShowClients()">${hmoShowClients ? 'Hide Clients' : 'Show Clients'}</button>`;
  const rateNote = isAll
    ? `<div class="rs-sub">Showing all HMO companies. Hover a checkbox to see its commission amount.</div>`
    : `<div class="rs-sub">Commission rate for ${escapeHtml(hmoActiveCompany)}: <strong>${prufinPct(flatRate)}</strong> of Premium per scheduled payment. Hover a checkbox to see its commission amount.</div>`;

  if(!sorted.length){
    mount.innerHTML = rateNote + toggleHtml + `<div class="rs-sub">No Issued clients yet${isAll ? '' : ' for ' + escapeHtml(hmoActiveCompany)}.</div>`;
    return;
  }

  if(!hmoShowClients){
    mount.innerHTML = rateNote + toggleHtml + `<div class="rs-sub">Client list is hidden. Click "Show Clients" above to view the table.</div>`;
    return;
  }

  const monthlyTotals = MONTHS.map((_, m) => sorted.reduce((sum, row) => {
    const scheduleMonths = hmoScheduleMonths(row, hmoViewYear);
    if(!scheduleMonths.includes(m)) return sum;
    return sum + parseCurrency(row.premium) * rateForRow(row);
  }, 0));
  const monthlyReceived = MONTHS.map((_, m) => sorted.reduce((sum, row) => {
    const scheduleMonths = hmoScheduleMonths(row, hmoViewYear);
    if(!scheduleMonths.includes(m)) return sum;
    const key = hmoClientKey(row);
    const paid = tracker.some(t => t.clientKey === key && t.year === hmoViewYear && t.monthIndex === m);
    if(!paid) return sum;
    return sum + parseCurrency(row.premium) * rateForRow(row);
  }, 0));

  const rows = sorted.map(row => {
    const key = hmoClientKey(row);
    const scheduleMonths = new Set(hmoScheduleMonths(row, hmoViewYear));
    const amount = parseCurrency(row.premium) * rateForRow(row);
    const monthCells = MONTHS.map((_, m) => {
      if(!scheduleMonths.has(m)) return `<td class="prufin-na">—</td>`;
      const paid = tracker.some(t => t.clientKey === key && t.year === hmoViewYear && t.monthIndex === m);
      return `<td><input type="checkbox" ${paid ? 'checked' : ''} onchange="toggleHmoPayment('${prufinJsStr(key)}', ${m}, this.checked)" title="${fmtCurrency(amount)}"></td>`;
    }).join('');
    return `<tr>
      <td style="text-align:left;"><span class="status-pill status-${(row.status || 'Active').replace(' ','\\ ')}">${escapeHtml(row.status || 'Active')}</span></td>
      <td style="text-align:left;">${escapeHtml(row.name || '')}</td>
      ${isAll ? `<td style="text-align:left;">${escapeHtml(row.hmo || '')}</td>` : ''}
      <td style="text-align:left;">${escapeHtml(fmtIssuedDate(row.submitted || ''))}</td>
      <td style="text-align:left;">${escapeHtml(row.mode || '')}</td>
      <td style="text-align:left;">${escapeHtml(hmoScheduleLabel(row, hmoViewYear))}</td>
      ${monthCells}
    </tr>`;
  }).join('');

  const labelColspan = isAll ? 6 : 5;
  mount.innerHTML = `
    ${rateNote}
    ${toggleHtml}
    <div class="statistics-table-wrap">
      <table class="statistics-table prufin-tracker-table">
        <thead><tr>
          <th style="text-align:left;">Status</th>
          <th style="text-align:left;">Name of Client</th>
          ${isAll ? `<th style="text-align:left;">HMO Company</th>` : ''}
          <th style="text-align:left;">Effectivity Date</th>
          <th style="text-align:left;">Mode</th>
          <th style="text-align:left;">Schedule of Payments</th>
          ${MONTHS.map(m => `<th>${m.slice(0,3)}</th>`).join('')}
        </tr>
        <tr class="prufin-tracker-totals-row">
          <th colspan="${labelColspan}" style="text-align:left; font-weight:600;">Total Commission This Month</th>
          ${monthlyTotals.map(total => `<th class="num">${total ? fmtCurrency(total) : '—'}</th>`).join('')}
        </tr>
        <tr class="prufin-tracker-totals-row prufin-tracker-received-row">
          <th colspan="${labelColspan}" style="text-align:left; font-weight:600;">Received Commission This Month</th>
          ${monthlyReceived.map(received => `<th class="num">${received ? fmtCurrency(received) : '—'}</th>`).join('')}
        </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
}

async function renderHmoCommissionsPanel(){
  if(!document.getElementById('hmo-highlights')) return;
  const yearSelect = document.getElementById('hmo-year-select');
  if(yearSelect) yearSelect.value = hmoViewYear;
  const sortSelect = document.getElementById('hmo-sort-select');
  if(sortSelect) sortSelect.value = hmoSortMode;

  await renderHmoHighlights(clients, overrides, tracker);
  await renderHmoCompanyTable(clients, overrides, tracker);
  await renderMoneyIncomePanel();
}

/* Actual PRUFINATED commission collected per calendar month of `year`:
   every scheduled payment marked Paid in the tracker, plus any manually
   entered commission for a month with no matching Issued-client payment. */
async function computePrufinActualByMonth(year){
  const clients = await getEntries('pru-clients');
  const overrides = await getEntries('prufin-rate-overrides');
  const est = computePrufinEstimate(clients, overrides, year, 'all');
  const tracker = await getEntries('prufin-payment-tracker');
  const paidSet = new Set(tracker.filter(t => t.year === year).map(t => t.clientKey + '|' + t.monthIndex));
  const byMonth = Array(12).fill(0);
  est.paymentsFlat.forEach(p => {
    if(paidSet.has(p.clientKey + '|' + p.monthIndex)) byMonth[p.monthIndex] += p.gross;
  });
  const manualEntries = await getEntries('prufin-manual-actuals');
  manualEntries.filter(m => m.year === year).forEach(m => { byMonth[m.monthIndex] += m.amount; });
  return byMonth;
}

/* Actual HUSTLES (HMO) commission received per calendar month of `year`:
   every scheduled payment, across every company, checked off in the
   Commissions payment tracker. */
async function computeHmoReceivedByMonth(year){
  const clients = await getEntries('hmo-clients');
  const overrides = await getEntries('hmo-rate-overrides');
  const tracker = await getEntries('hmo-payment-tracker');
  const byMonth = Array(12).fill(0);
  clients.forEach(row => {
    const rate = hmoRateFor(overrides, row.hmo);
    const amount = parseCurrency(row.premium) * rate;
    const key = hmoClientKey(row);
    hmoScheduleMonths(row, year).forEach(m => {
      const paid = tracker.some(t => t.clientKey === key && t.year === year && t.monthIndex === m);
      if(paid) byMonth[m] += amount;
    });
  });
  return byMonth;
}

/* -- live countdown to Jan 1, 2027, shown at the top of Rewards & Achievements -- */
let yearCountdownTimer = null;
function startYearCountdown(){
  if(yearCountdownTimer) clearInterval(yearCountdownTimer);
  function tick(){
    const el = document.getElementById('year-countdown-value');
    if(!el){ clearInterval(yearCountdownTimer); yearCountdownTimer = null; return; }
    const target = new Date(2027, 0, 1, 0, 0, 0);
    const diff = Math.max(0, target - new Date());
    const days = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    const minutes = Math.floor((diff % 3600000) / 60000);
    const seconds = Math.floor((diff % 60000) / 1000);
    el.textContent = `${days}d ${String(hours).padStart(2,'0')}h ${String(minutes).padStart(2,'0')}m ${String(seconds).padStart(2,'0')}s`;
  }
  tick();
  yearCountdownTimer = setInterval(tick, 1000);
}

/* -- Premium × Mode of Payment → APE, live in the add/edit client form --
   Annual×1, Semi-Annual×2, Quarterly×4, Monthly×12 (reuses MODE_FREQ). */
function setupApeAutoCalc(item, config){
  const hasKeys = ['premium','mode','ape'].every(k => config.columns.some(c => c.key === k));
  if(!hasKeys) return;
  const premiumEl = document.getElementById(item.id + '-f-premium');
  const modeEl = document.getElementById(item.id + '-f-mode');
  const apeEl = document.getElementById(item.id + '-f-ape');
  if(!premiumEl || !modeEl || !apeEl) return;
  function recalc(){
    const premium = parseCurrency(premiumEl.value);
    const freq = MODE_FREQ[modeEl.value];
    if(premium && freq) apeEl.value = (premium * freq).toFixed(2);
  }
  premiumEl.addEventListener('input', recalc);
  modeEl.addEventListener('change', recalc);
}

async function renderStatisticsPanel(){
  if(!statisticsMount) return;
  const clients = await getEntries('pru-clients');
  const today = new Date();
  const currentYear = today.getFullYear();
  const months = [...MONTHS];
  const rows = clients.filter(row => !row.status || String(row.status).toLowerCase() === 'issued').map(row => ({
    ...row,
    statsDate: submittedDateFromMonth(row.submitted, currentYear),
  })).filter(row => row.statsDate);
  const own = rows.filter(row => (row.clientType || 'Own') === 'Own');
  const adopted = rows.filter(row => (row.clientType || 'Own') === 'Adopted');
  const ownYtd = own.filter(row => row.statsDate.getFullYear() === currentYear && row.statsDate <= today);
  const average = values => values.length ? values.reduce((sum, value) => sum + value, 0) / values.length : 0;
  const totalApe = list => list.reduce((sum, row) => sum + parseCurrency(row.ape), 0);
  const planRows = list => {
    const grouped = {};
    list.forEach(row => {
      const plan = row.plan || 'Unspecified';
      if(!grouped[plan]) grouped[plan] = { plan, clients:0, ape:0 };
      grouped[plan].clients += 1;
      grouped[plan].ape += parseCurrency(row.ape);
    });
    return Object.values(grouped).sort((a, b) => b.ape - a.ape);
  };
  const monthly = months.map((month, index) => {
    const monthRows = ownYtd.filter(row => row.statsDate.getMonth() === index);
    return { month, clients: monthRows.length, ape: totalApe(monthRows) };
  });
  const activeMonths = monthly.filter(row => row.clients > 0);
  const yearly = {};
  own.forEach(row => {
    const year = row.statsDate.getFullYear();
    if(!yearly[year]) yearly[year] = { year, clients:0, ape:0 };
    yearly[year].clients += 1;
    yearly[year].ape += parseCurrency(row.ape);
  });
  const yearlyRows = Object.values(yearly).sort((a, b) => b.year - a.year);
  const yearlyByYear = Object.fromEntries(yearlyRows.map(row => [row.year, row]));
  yearlyRows.forEach(row => {
    const previous = yearlyByYear[row.year - 1];
    row.growth = previous && previous.ape > 0 ? ((row.ape - previous.ape) / previous.ape) * 100 : null;
  });
  const chartBars = (list, labelKey, valueKey, formatter) => {
    if(!list.length) return '<div class="statistics-empty">No data to chart.</div>';
    const maximum = Math.max(...list.map(row => row[valueKey]), 1);
    return `<div class="statistics-bar-list">${list.map(row => `<div class="statistics-bar-row"><div class="statistics-bar-label">${escapeHtml(row[labelKey])}</div><div class="statistics-bar-track"><div class="statistics-bar-fill" style="width:${(row[valueKey] / maximum) * 100}%"></div></div><div class="statistics-bar-value">${formatter(row[valueKey])}</div></div>`).join('')}</div>`;
  };
  const ownApe = totalApe(own);
  const adoptedApe = totalApe(adopted);
  const combinedApe = ownApe + adoptedApe;
  const ownShare = combinedApe ? (ownApe / combinedApe) * 360 : 0;
  const rewardApeRows = own.filter(row => row.statsDate.getFullYear() === 2026);
  const rewardApe = totalApe(rewardApeRows);
  const rewardLadder = ACHIEVEMENTS.filter(item => item.basis !== 'fyp').sort((a, b) => a.threshold - b.threshold);
  const achievedRewards = rewardLadder.filter(item => rewardApe >= item.threshold);
  const nextReward = rewardLadder.find(item => rewardApe < item.threshold);
  const highestReward = achievedRewards[achievedRewards.length - 1];
  const travelDeadline = TRAVEL_INCENTIVES[0]?.deadline || '2026-11-30';
  const travelDeadlineLabel = new Date(travelDeadline + 'T00:00:00').toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' });
  const mdrtDeadlineLabel = 'December 31, 2026';
  const assessment = nextReward
    ? `Your 2026 issued production is ${fmtCurrency(rewardApe)} APE. You have reached ${highestReward ? highestReward.label : 'the starting line'} and are ${fmtCurrency(Math.max(0, nextReward.threshold - rewardApe))} away from ${nextReward.label}. Do not wait for motivation: schedule the next conversations, follow up daily, and track issued Own production every week.`
    : `Your 2026 issued production is ${fmtCurrency(rewardApe)} APE, beyond the ${highestReward.label} milestone. Sustain the pace, protect your quality standard, and keep building toward the FYP-based MDRT goal.`;
  const assessmentNotes = `Strict notes: South Korea production is counted only from August through November and the travel deadline is ${travelDeadlineLabel}. MDRT qualification is FYP-based and must be secured by ${mdrtDeadlineLabel}. A goal without weekly issued production, follow-ups, and documented next actions is only a wish.`;
  statisticsMount.innerHTML = `
    <button class="statistics-back" onclick="closeStatistics()">← Back to dashboard</button>
    <h1>Statistics</h1>
    <div class="sub">Issued client production, plan mix, and own-client performance.</div>
    <h2>Statistics for Own &amp; Adopted</h2>
    <div class="stats-sub">Issued clients only. Lapsed clients are excluded.</div>
    <div class="statistics-grid">
      <div class="statistics-card"><h3>Own</h3><div class="statistics-values"><div><div class="statistics-label">Clients</div><div class="statistics-value">${own.length}</div></div><div><div class="statistics-label">APE</div><div class="statistics-value">${fmtCurrency(totalApe(own))}</div></div><div><div class="statistics-label">Avg APE</div><div class="statistics-value">${fmtCurrency(average(own.map(row => parseCurrency(row.ape))))}</div></div></div></div>
      <div class="statistics-card"><h3>Adopted</h3><div class="statistics-values"><div><div class="statistics-label">Clients</div><div class="statistics-value">${adopted.length}</div></div><div><div class="statistics-label">APE</div><div class="statistics-value">${fmtCurrency(totalApe(adopted))}</div></div><div><div class="statistics-label">Avg APE</div><div class="statistics-value">${fmtCurrency(average(adopted.map(row => parseCurrency(row.ape))))}</div></div></div></div>
    </div>
    <div class="statistics-chart-grid">
      <div class="statistics-chart-card"><h3>APE by Client Type</h3><div class="statistics-pie" style="background:conic-gradient(var(--brass) 0deg ${ownShare}deg, var(--navy) ${ownShare}deg 360deg);"></div><div class="statistics-legend"><span><i class="statistics-swatch" style="background:var(--brass)"></i>Own ${combinedApe ? ((ownApe / combinedApe) * 100).toFixed(1) : '0.0'}%</span><span><i class="statistics-swatch" style="background:var(--navy)"></i>Adopted ${combinedApe ? ((adoptedApe / combinedApe) * 100).toFixed(1) : '0.0'}%</span></div></div>
      <div class="statistics-chart-card"><h3>APE by Plan Type (Own)</h3>${chartBars(planRows(own), 'plan', 'ape', fmtCurrency)}</div>
    </div>
    <h2>Plan Types</h2>
    <div class="stats-sub">Plan mix for Own and Adopted issued clients.</div>
    <h3>Own</h3>${statisticsTable(planRows(own))}
    <h3>Adopted</h3>${statisticsTable(planRows(adopted))}
    <h2>Own Client Performance</h2>
    <div class="stats-sub">Current year is ${currentYear}. Monthly averages use months with at least one Own client.</div>
    <div class="statistics-grid">
      <div class="statistics-card"><div class="statistics-label">Average No. of Clients per Month</div><div class="statistics-value">${average(activeMonths.map(row => row.clients)).toFixed(1)}</div><div class="statistics-note">${activeMonths.length} active month${activeMonths.length === 1 ? '' : 's'}</div></div>
      <div class="statistics-card"><div class="statistics-label">Average APE Size per Month</div><div class="statistics-value">${fmtCurrency(average(activeMonths.map(row => row.ape)))}</div><div class="statistics-note">Average monthly Own APE</div></div>
      <div class="statistics-card"><div class="statistics-label">Average APE Size YTD</div><div class="statistics-value">${fmtCurrency(average(ownYtd.map(row => parseCurrency(row.ape))))}</div><div class="statistics-note">Average per Own client</div></div>
      <div class="statistics-card"><div class="statistics-label">Own APE YTD</div><div class="statistics-value">${fmtCurrency(totalApe(ownYtd))}</div><div class="statistics-note">${ownYtd.length} Own client${ownYtd.length === 1 ? '' : 's'}</div></div>
    </div>
    <h2>Production per Year (Own)</h2>
    <div class="stats-sub">Own issued client count and APE by production year.</div>
    <div class="statistics-chart-card"><h3>Yearly Own APE</h3>${chartBars(yearlyRows, 'year', 'ape', fmtCurrency)}</div>
    <div class="statistics-table-wrap"><table class="statistics-table"><thead><tr><th>Year</th><th>Clients</th><th>Total APE</th><th>Average APE</th><th>Growth</th></tr></thead><tbody>${yearlyRows.length ? yearlyRows.map(row => `<tr><td>${row.year}</td><td class="num">${row.clients}</td><td class="num">${fmtCurrency(row.ape)}</td><td class="num">${fmtCurrency(row.ape / row.clients)}</td><td class="num">${row.growth == null ? 'New' : `${row.growth >= 0 ? '+' : ''}${row.growth.toFixed(1)}%`}</td></tr>`).join('') : '<tr><td colspan="5" class="statistics-empty">No production data yet.</td></tr>'}</tbody></table></div>
    <h2>Own Monthly Production - ${currentYear}</h2>
    <div class="statistics-table-wrap"><table class="statistics-table"><thead><tr><th>Month</th><th>Clients</th><th>APE</th><th>Average APE</th></tr></thead><tbody>${monthly.map(row => `<tr><td>${row.month}</td><td class="num">${row.clients}</td><td class="num">${fmtCurrency(row.ape)}</td><td class="num">${fmtCurrency(row.clients ? row.ape / row.clients : 0)}</td></tr>`).join('')}</tbody></table></div>
    <div class="statistics-assessment"><h2>2026 Sales Assessment</h2><p>${assessment}</p><p class="statistics-note">${assessmentNotes}</p></div>
  `;
}

function renderView(){
  const homePanel = document.getElementById('home-panel');
  if(activeGroup === null){
    if(homePanel) homePanel.style.display = 'flex';
    boxGrid.style.display = 'none';
    document.getElementById('group-title').style.display = 'none';
    document.getElementById('group-sub').style.display = 'none';

    statisticsMount.classList.remove('visible');
    if(prufinStatisticsMount) prufinStatisticsMount.classList.remove('visible');
    return;
  }
  if(homePanel) homePanel.style.display = 'none';
  if(prufinStatsOpen && (activeGroup !== 'pru' || activeLeaf !== 'prufin')){
    prufinStatsOpen = false;
  }
  if(prufinStatsOpen){
    boxGrid.style.display = 'none';
    document.getElementById('group-title').style.display = 'none';
    document.getElementById('group-sub').style.display = 'none';
    document.querySelectorAll('.leaf-view').forEach(p => p.classList.remove('visible'));
    statisticsMount.classList.remove('visible');
    if(prufinStatisticsMount) prufinStatisticsMount.classList.add('visible');
    return;
  }
  if(prufinStatisticsMount) prufinStatisticsMount.classList.remove('visible');
  if(statisticsOpen){
    boxGrid.style.display = 'none';
    document.getElementById('group-title').style.display = 'none';
    document.getElementById('group-sub').style.display = 'none';
    document.querySelectorAll('.leaf-view').forEach(p => p.classList.remove('visible'));
    statisticsMount.classList.add('visible');
    return;
  }
  statisticsMount.classList.remove('visible');
  const showGrid = activeLeaf === null;
  boxGrid.style.display = showGrid ? 'grid' : 'none';
  document.getElementById('group-title').style.display = showGrid ? 'block' : 'none';
  document.getElementById('group-sub').style.display = showGrid ? 'block' : 'none';
  document.querySelectorAll('.leaf-view').forEach(p => p.classList.remove('visible'));
  if(!showGrid){
    document.getElementById('leaf-' + activeLeaf).classList.add('visible');
  }
}

// Restarts the "view-enter" CSS animation on an element even if it already
// has the class, by removing it, forcing a reflow, then re-adding it.
function playEnterAnimation(el){
  if(!el) return;
  el.classList.remove('view-enter');
  void el.offsetWidth;
  el.classList.add('view-enter');
}

const leadSortState = {};
const leadViewState = {};
function setLeadView(id, view){
  leadViewState[id] = view;

function leadDateValue(row){
  return row.contactStarted ? new Date(row.contactStarted + 'T00:00:00') : row.dateAdded ? new Date(row.dateAdded) : new Date(row.ts || 0);
}
function leadDateLabel(row){
  const date = leadDateValue(row);
  return date.getTime() ? date.toLocaleDateString('en-US', { year:'numeric', month:'short', day:'numeric' }) : '';
}
function leadDaysSince(row){
  const date = leadDateValue(row);
  if(!date.getTime()) return '';
  return Math.max(0, Math.floor((Date.now() - date.getTime()) / 86400000));
}
function leadRemark(status){
  return status === 'App Submitted' || status === 'Issued' ? 'Nurture Client' : 'Followup';
}
function nextLeadMove(lastMove){
  if(lastMove === 'Push') return 'Pull';
  if(lastMove === 'Pull') return 'Push';
  return '';
}
function nurtureFocus(days){
  if(days <= 1) return { move:'Push', text:'Start & discover' };
  if(days === 2) return { move:'Pull', text:'Give space' };
  if(days === 3) return { move:'Push', text:'Educate' };
  if(days === 4) return { move:'Pull', text:'' };
  if(days === 5) return { move:'Push', text:'Invite to assessment' };
  if(days === 6) return { move:'Pull', text:'' };
  if(days === 7) return { move:'Push', text:'Give value' };
  if(days === 8) return { move:'Pull', text:'' };
  if(days <= 10) return { move:'Push', text:'Build trust + recommend' };
  if(days === 11) return { move:'Pull', text:'Let them think' };
  if(days === 12) return { move:'Push', text:'Ask for decision' };
  if(days === 13) return { move:'Pull', text:'Remove pressure' };
  return { move:'Both', text:'Close the loop' };
}
function nurtureFocusHtml(row){
  const focus = nurtureFocus(leadDaysSince(row));
  if(focus.move === 'Both') return `<span class="move-badge move-push">PUSH</span><span class="move-badge move-pull">PULL</span> — ${focus.text}`;
  return `${moveBadge(focus.move)}${focus.text ? ` — ${focus.text}` : ''}`;
}
function moveBadge(move){
  if(!move) return '<span class="lead-detail-value empty">Not set</span>';
  const className = move.toLowerCase() === 'push' ? 'move-push' : 'move-pull';
  return `<span class="move-badge ${className}">${move}</span>`;
}
function needsNurture(row){
  const days = leadDaysSince(row);
  return days !== '' && days >= 0 && days <= 14;
}
function needsLongTermNurture(row){
  const days = leadDaysSince(row);
  return days !== '' && days >= 15;
}
function setLeadSort(id, value){
  leadSortState[id] = value;
  renderLeadTable(id);
}
async function renderLeadTable(id){
  const entries = await getEntries(id);
  document.getElementById(id + '-push-pull-note')?.classList.toggle('visible', leadViewState[id] === 'nurture');
  const viewEntries = leadViewState[id] === 'nurture'
    ? entries.filter(needsNurture)
    : leadViewState[id] === 'longterm'
      ? entries.filter(needsLongTermNurture)
      : entries;
  const query = searchState[id] || '';
  const visibleEntries = query
    ? viewEntries.filter(row => Object.values(row).some(value => String(value ?? '').toLowerCase().includes(query)))
    : viewEntries;
  const listEl = document.getElementById(id + '-list');
  const bcount = document.getElementById('bcount-' + id);
  if(bcount) bcount.textContent = entries.length;
  const sortMode = leadSortState[id] || 'date-desc';
  const sorted = [...visibleEntries].sort((a, b) => {

async function updateServicingField(id, idx, field, value){
  const entries = await getEntries(id);
  if(!entries[idx]) return;
  entries[idx] = { ...entries[idx], [field]: value };
  const ok = await saveEntries(id, entries);
  const note = document.getElementById(id + '-savenote');
  if(note){
    note.textContent = ok ? 'Saved.' : 'Could not save — please try again.';
    setTimeout(() => { if(note.textContent === 'Saved.') note.textContent = ''; }, 1500);
  }
}

function leadFieldValue(id, col){
  const field = document.getElementById(id + '-f-' + col.key);
  if(!field) return '';
  if(col.type === 'checklist') return [...field.selectedOptions].map(option => option.value);
  return field.value.trim();
}
function setLeadFieldValue(id, col, value){
  const field = document.getElementById(id + '-f-' + col.key);
  if(!field) return;
  if(col.type === 'checklist'){
    const values = Array.isArray(value) ? value : [];
    [...field.options].forEach(option => { option.selected = values.includes(option.value); });
  }else field.value = value || '';
}
async function addLeadRow(id){
  const config = TABLE_LEAVES[id];
  const noteEl = document.getElementById(id + '-savenote');
  const row = {};
  config.columns.forEach(col => { row[col.key] = leadFieldValue(id, col); });
  if(!row.name){ noteEl.textContent = 'Add the lead name first.'; noteEl.style.color = 'var(--red)'; return; }
  const entries = await getEntries(id);
  const editing = editState[id];
  if(editing != null && entries[editing]) entries[editing] = { ...entries[editing], ...row };
  else { row.ts = Date.now(); row.dateAdded = new Date().toISOString(); entries.push(row); }
  const ok = await saveEntries(id, entries);
  if(ok){
    config.columns.forEach(col => setLeadFieldValue(id, col, ''));
    noteEl.textContent = editing != null ? 'Changes saved.' : 'Saved.';
    noteEl.style.color = 'var(--ink-soft)';
    if(editing != null) clearEditMode(id, 'Add lead');
  }else{ noteEl.textContent = 'Could not save' + (window.lastFbError ? ' — ' + window.lastFbError : ' — please try again.'); noteEl.style.color = 'var(--red)'; }
  if(ok && row.status === 'Issued') await moveIssuedLeadToServicing(editing != null ? entries[editing] : row);
  await refreshAfterClientChange(id);
}
async function moveIssuedLeadToServicing(lead){
  const servicing = await getEntries('pru-servicing');
  const sourceKey = lead.ts || `${lead.name}|${lead.contactStarted || ''}`;
  if(servicing.some(client => client.sourceLeadKey === sourceKey)) return;
  servicing.push({
    ...lead,
    name: lead.name,
    issuedDate: lead.contactStarted || new Date().toISOString().slice(0, 10),
    servicingType: 'Own',
    status: 'Issued',
    notes: `Moved from Pru Leads${lead.lastContact ? ` · Last contact ${lead.lastContact}` : ''}`,
    sourceLeadKey: sourceKey,
    ts: Date.now()
  });
  await saveEntries('pru-servicing', servicing);
  const leads = await getEntries('pru-leads');
  const index = leads.findIndex(item => (item.ts || `${item.name}|${item.contactStarted || ''}`) === sourceKey);
  if(index >= 0){ leads.splice(index, 1); await saveEntries('pru-leads', leads); }
}
async function migrateExistingIssuedLeads(){
  const leads = await getEntries('pru-leads');
  const issued = leads.filter(row => row.status === 'Issued');
  for(const lead of issued) await moveIssuedLeadToServicing(lead);
}
async function syncClientsToServicing(){
  const clients = await getEntries('pru-clients');
  const servicing = await getEntries('pru-servicing');
  let changed = false;
  for(const client of clients){
    const sourceKey = client.ts || `${client.name}|${client.submitted || ''}`;
    const existing = servicing.find(entry =>
      entry.sourceClientKey === sourceKey ||
      (!entry.sourceClientKey && entry.name === client.name && (entry.issuedDate || entry.submitted || '') === (client.submitted || ''))
    );
    if(existing){
      Object.assign(existing, client, {
        issuedDate: client.submitted || '',
        servicingType: client.clientType || existing.servicingType || 'Own',
        sourceClientKey: sourceKey
      });
      changed = true;
      continue;
    }
    servicing.push({
      ...client,
      issuedDate: client.submitted || '',
      servicingType: client.clientType || 'Own',
      sourceClientKey: sourceKey,
      ts: Date.now() + Math.random()
    });
    changed = true;
  }
  if(changed) await saveEntries('pru-servicing', servicing);
}
async function syncServicingToClients(){
  const servicing = await getEntries('pru-servicing');
  const clients = await getEntries('pru-clients');
  let changed = false;
  for(const service of servicing.filter(row => row.status === 'Issued')){
    const sourceKey = service.sourceClientKey || service.sourceLeadKey || `servicing:${service.ts || `${service.name}|${service.issuedDate || ''}`}`;
    const existing = clients.find(client => client.sourceServicingKey === sourceKey || client.ts === service.ts || (client.name === service.name && (client.submitted || '') === (service.issuedDate || '')));
    const clientData = {
      ...service,
      name: service.name || '',
      submitted: service.issuedDate || service.submitted || '',
      status: 'Issued',
      clientType: service.servicingType || service.clientType || 'Own',
      sourceServicingKey: sourceKey,
      ts: existing?.ts || Date.now() + Math.random()
    };
    if(existing) Object.assign(existing, clientData);
    else clients.push(clientData);
    changed = true;
  }
  if(changed) await saveEntries('pru-clients', clients);
}

async function renderTable(id){
  const config = TABLE_LEAVES[id];
  const allEntries = await getEntries(id);
  const entries = id === 'pru-clients' && clientYearFilter !== 'all'
    ? allEntries.filter(row => {
        const issuedDate = submittedDateFromMonth(row.submitted, 2026);
        return issuedDate && issuedDate.getFullYear() === Number(clientYearFilter);
      })
    : allEntries;
  const fypAsOfDate = new Date();
  const listEl = document.getElementById(id + '-list');
  const totalsEl = document.getElementById(id + '-totals');
  const bcount = document.getElementById('bcount-' + id);
  if(bcount) bcount.textContent = entries.length;

  // Totals — computed regardless of entry count and shown big, above the table.
  const totals = {};
  config.totalKeys.forEach(k => totals[k] = 0);
  entries.forEach(row => {
    config.totalKeys.forEach(k => {
      const col = config.columns.find(c => c.key === k);
      totals[k] += (col && col.type === 'computed') ? clientFYP(row, fypAsOfDate) : parseCurrency(row[k]);
    });
  });
  if(totalsEl && id === 'hmo-clients'){
    const activeEntries = allEntries.filter(row => String(row.status || 'Active').toLowerCase() !== 'inactive');
    const inactiveEntries = allEntries.filter(row => String(row.status || '').toLowerCase() === 'inactive');
    const sumRows = (rows, key) => rows.reduce((sum, row) => sum + parseCurrency(row[key]), 0);
    totalsEl.innerHTML = `
      <div class="client-metrics">
        <div class="client-metrics-primary">
          <div class="client-metric"><div class="client-metric-label">Total Clients</div><div class="client-metric-value">${allEntries.length}</div></div>
          <div class="client-metric"><div class="client-metric-label">Active Clients</div><div class="client-metric-value">${activeEntries.length}</div></div>
          <div class="client-metric"><div class="client-metric-label">Inactive Clients</div><div class="client-metric-value">${inactiveEntries.length}</div></div>
          <div class="client-metric"><div class="client-metric-label">Total Premium</div><div class="client-metric-value">${fmtCurrency(sumRows(allEntries, 'premium'))}</div></div>
          <div class="client-metric"><div class="client-metric-label">Total APE</div><div class="client-metric-value">${fmtCurrency(sumRows(allEntries, 'ape'))}</div></div>
        </div>
      </div>`;
  }else if(totalsEl && id === 'pru-clients'){
    const today = new Date();
    const currentYear = today.getFullYear();
    const issuedEntries = allEntries.filter(row => !row.status || String(row.status).toLowerCase() === 'issued');
    const ownIssuedEntries = issuedEntries.filter(row => (row.clientType || 'Own') === 'Own');
    const ytdRows = issuedEntries.filter(row => {
      const issuedDate = submittedDateFromMonth(row.submitted, currentYear);
      return issuedDate
        && issuedDate.getFullYear() === currentYear
        && issuedDate <= today
        && (row.clientType || 'Own') === 'Own';
    });
    const ytdEntries = ytdRows.length;
    const sumRows = (rows, key) => rows.reduce((sum, row) => sum + parseCurrency(row[key]), 0);
    const ytdAPE = sumRows(ytdRows, 'ape');
    const ytdPremium = sumRows(ytdRows, 'premium');
    const ytdSA = sumRows(ytdRows, 'sa');
    const totalAPE = sumRows(issuedEntries, 'ape');
    const totalPremium = sumRows(issuedEntries, 'premium');
    const totalSA = sumRows(issuedEntries, 'sa');
    const ownCount = issuedEntries.filter(row => (row.clientType || 'Own') === 'Own').length;
    const adoptedCount = issuedEntries.filter(row => row.clientType === 'Adopted').length;
    totalsEl.innerHTML = `
      <div class="client-metrics">
        <div class="client-metrics-primary">
          <div class="client-metric"><div class="client-metric-label">YTD Total No. of Clients</div><div class="client-metric-value">${ytdEntries}</div></div>
          <div class="client-metric"><div class="client-metric-label">YTD Total APE</div><div class="client-metric-value">${fmtCurrency(ytdAPE)}</div></div>
          <div class="client-metric"><div class="client-metric-label">FYP</div><div class="client-metric-value">${fmtCurrency(ownIssuedEntries.reduce((sum, row) => sum + clientFYP(row, fypAsOfDate), 0))}</div></div>
          <div class="client-metric"><div class="client-metric-label">YTD Total Premium</div><div class="client-metric-value">${fmtCurrency(ytdPremium)}</div></div>
          <div class="client-metric"><div class="client-metric-label">YTD Total SA</div><div class="client-metric-value">${fmtCurrency(ytdSA)}</div></div>
        </div>
        <div class="client-metrics-secondary">
          <div class="client-metric secondary"><div class="client-metric-label">Active Clients</div><div class="client-metric-value">${ownCount + adoptedCount}</div></div>
          <div class="client-metric secondary"><div class="client-metric-label">Adopted Clients</div><div class="client-metric-value">${adoptedCount}</div></div>
          <div class="client-metric secondary"><div class="client-metric-label">Own Clients</div><div class="client-metric-value">${ownCount}</div></div>
          <div class="client-metric secondary"><div class="client-metric-label">Total APE Since Inception</div><div class="client-metric-value">${fmtCurrency(totalAPE)}</div></div>
          <div class="client-metric secondary"><div class="client-metric-label">Total Premium Since Inception</div><div class="client-metric-value">${fmtCurrency(totalPremium)}</div></div>
          <div class="client-metric secondary"><div class="client-metric-label">Total SA Since Inception</div><div class="client-metric-value">${fmtCurrency(totalSA)}</div></div>
        </div>
      </div>`;
  }

  if(id === 'pru-clients'){
    const toggleBtn = document.getElementById(id + '-toggle-clients');
    if(toggleBtn) toggleBtn.textContent = issuedClientsVisible ? 'Hide Clients' : 'Show Clients';
    if(!issuedClientsVisible){
      listEl.innerHTML = `<div class="rs-sub">Client list is hidden. Click "Show Clients" above to view the table.</div>`;
      await renderGroupCount(idToGroup(id));
      await renderRewardsPanel(); await renderPrufinPanel(); if(prufinStatsOpen) await renderPrufinStatisticsPanel();
      await renderMoneyIncomePanel();
      return;
    }
  }

  if(entries.length === 0){
    listEl.innerHTML = `<div class="empty">No entries yet — add your first client above.</div>`;
    await renderGroupCount(idToGroup(id));
    if(id === 'pru-clients'){ await renderRewardsPanel(); await renderPrufinPanel(); if(prufinStatsOpen) await renderPrufinStatisticsPanel(); }
    if(id === 'hmo-clients'){ await renderHmoCommissionsPanel(); }
    if(id === 'pru-clients' || id === 'hmo-clients'){ await renderMoneyIncomePanel(); }
    return;
  }

  const sortMode = sortState[id] || 'date-asc';
  const statusFiltered = sortMode === 'status-issued'
    ? entries.filter(row => !row.status || String(row.status).toLowerCase() === 'issued')
    : sortMode === 'status-lapsed'
      ? entries.filter(row => String(row.status || '').toLowerCase() === 'lapsed')
      : entries;
  const sorted = [...statusFiltered].sort((a, b) => {
    if(sortMode === 'name-asc'){
      return (a.name || '').toLowerCase().localeCompare((b.name || '').toLowerCase());
    }
    if(sortMode === 'date-asc'){
      const aDate = submittedDateFromMonth(a.submitted, 2026);
      const bDate = submittedDateFromMonth(b.submitted, 2026);
      return (aDate ? aDate.getTime() : 0) - (bDate ? bDate.getTime() : 0);
    }
    if(sortMode === 'plan-asc') return (a.plan || '').localeCompare(b.plan || '');
    if(sortMode === 'mode-asc') return (a.mode || '').localeCompare(b.mode || '');
    if(sortMode === 'ape-desc'){
      return parseCurrency(b.ape) - parseCurrency(a.ape);
    }
    return (a.ts || 0) - (b.ts || 0);
  });

  const sortSelect = document.getElementById(id + '-sort');
  if(sortSelect) sortSelect.value = sortMode;
  const yearSelect = document.getElementById(id + '-year');
  if(yearSelect) yearSelect.value = clientYearFilter;

  const headCells = config.columns.map(c => `<th>${c.label}</th>`).join('') + '<th></th>';
  const query = searchState[id] || '';
  const filtered = query
    ? sorted.filter(row => Object.values(row).some(value => String(value ?? '').toLowerCase().includes(query)))
    : sorted;
  const bodyRows = filtered.map(row => {
    const idx = allEntries.indexOf(row);
    const cells = config.columns.map(c => {
      const v = row[c.key];
      if(c.type === 'computed'){
        return `<td class="num">${fmtCurrency(clientFYP(row, fypAsOfDate))}</td>`;
      }
      if(c.type === 'currency'){
        return `<td class="num">${fmtCurrency(parseCurrency(v))}</td>`;
      }
      if(c.type === 'date'){
        return `<td>${escapeHtml(fmtIssuedDate(v || ''))}</td>`;
      }
      if(c.type === 'month'){
        return `<td>${escapeHtml(fmtMonthValue(v || ''))}</td>`;
      }
      if(c.type === 'url'){
        const href = contactHref(v);
        return `<td>${href ? `<a class="contact-link" href="${escapeHtml(href)}" target="_blank" rel="noopener">Open Link</a>` : ''}</td>`;
      }
      if(c.key === 'status' && v){
        return `<td><span class="status-pill status-${v.replace(' ','\\ ')}">${escapeHtml(v)}</span></td>`;
      }
      return `<td>${escapeHtml(v || '')}</td>`;
    }).join('');
    return `<tr>${cells}<td><button class="row-del" onclick="editTableRow('${id}', ${idx})">Edit</button>&nbsp;&nbsp;<button class="row-del" onclick="deleteEntry('${id}', ${idx})">Remove</button></td></tr>`;
  }).join('');

  listEl.innerHTML = `
    <div class="table-scroll">
      <table class="data-table">
        <thead><tr>${headCells}</tr></thead>
        <tbody>${bodyRows}</tbody>
      </table>
    </div>
  `;
  await renderGroupCount(idToGroup(id));
  if(id === 'pru-clients'){ await renderRewardsPanel(); await renderPrufinPanel(); if(prufinStatsOpen) await renderPrufinStatisticsPanel(); }
  if(id === 'hmo-clients'){ await renderHmoCommissionsPanel(); }
  if(id === 'pru-clients' || id === 'hmo-clients'){ await renderMoneyIncomePanel(); }
}

function idToGroup(leafId){
  const g = GROUPS.find(g => g.items.some(i => i.id === leafId));
  return g ? g.id : null;
}

async function renderGroupCount(groupId){
  if(!groupId) return;
  const group = GROUPS.find(g => g.id === groupId);
  const el = document.getElementById('gcount-' + groupId);
  if(group.id === 'sites'){
    if(el) el.textContent = group.items.length;
    return;
  }
  let total = 0;
  for(const item of group.items){
    const entries = await getEntries(item.id);
    total += entries.length;
  }
  if(el) el.textContent = total;
}

async function renderAllCounts(){
  await Promise.all(GROUPS.map(async g => {
    await Promise.all(g.items.filter(item => !item.url).map(async item => {
      const entries = await getEntries(item.id);
      const bcount = document.getElementById('bcount-' + item.id);
      if(bcount) bcount.textContent = entries.length;
    }));
    await renderGroupCount(g.id);
  }));
}

async function refreshAfterClientChange(id){
  if(id === 'pru-clients'){
    await syncClientsToServicing();
    await renderList('pru-servicing');
  }
  if(id === 'pru-servicing'){
    await syncServicingToClients();
    await renderList('pru-clients');
  }
  await renderList(id);
  await renderAllCounts();
  if(id === 'pru-clients'){
    await renderRewardsPanel();
    await renderPrufinPanel();
    if(prufinStatsOpen) await renderPrufinStatisticsPanel();
  }
}

/* ---------- edit-mode helpers ---------- */
function setEditMode(id, idx, label){
  editState[id] = idx;
  const btn = document.getElementById(id + '-submit');
  const cancel = document.getElementById(id + '-cancel');
  if(btn) btn.textContent = label;
  if(cancel) cancel.style.display = 'inline';
}
function clearEditMode(id, label){
  editState[id] = null;
  const btn = document.getElementById(id + '-submit');
  const cancel = document.getElementById(id + '-cancel');
  if(btn) btn.textContent = label;
  if(cancel) cancel.style.display = 'none';
}
function cancelEdit(id){
  if(TABLE_LEAVES[id]){
    const config = TABLE_LEAVES[id];
    config.columns.forEach(col => { if(col.type === 'computed') return; document.getElementById(id + '-f-' + col.key).value = ''; });
    clearEditMode(id, 'Add client');
  }else{
    document.getElementById(id + '-title').value = '';
    document.getElementById(id + '-date').value = '';
    document.getElementById(id + '-value').value = '';
    document.getElementById(id + '-contact-link').value = '';
    document.getElementById(id + '-notes').value = '';
    clearEditMode(id, 'Add entry');
  }
  const noteEl = document.getElementById(id + '-savenote');
  if(noteEl) noteEl.textContent = '';
}

/* ---------- entry CRUD: generic ---------- */
async function addEntry(id){
  const title = document.getElementById(id + '-title').value.trim();
  const date = document.getElementById(id + '-date').value;
  const value = document.getElementById(id + '-value').value.trim();
  const contactLink = document.getElementById(id + '-contact-link').value.trim();
  const notes = document.getElementById(id + '-notes').value.trim();
  const noteEl = document.getElementById(id + '-savenote');

  if(!title && !value && !notes && !contactLink){
    noteEl.textContent = 'Add at least a title, value, or note first.';
    noteEl.style.color = 'var(--red)';
    return;
  }

  const entries = await getEntries(id);
  const editing = editState[id];
  if(editing != null && entries[editing]){
    entries[editing] = { ...entries[editing], title, date, value, contactLink, notes };
  }else{
    entries.push({ title, date, value, contactLink, notes, ts: Date.now() });
  }
  const ok = await saveEntries(id, entries);

  if(ok){
    document.getElementById(id + '-title').value = '';
    document.getElementById(id + '-date').value = '';
    document.getElementById(id + '-value').value = '';
    document.getElementById(id + '-contact-link').value = '';
    document.getElementById(id + '-notes').value = '';
    noteEl.textContent = editing != null ? 'Changes saved.' : 'Saved.';
    noteEl.style.color = 'var(--ink-soft)';
    setTimeout(() => { if(noteEl.textContent === 'Saved.' || noteEl.textContent === 'Changes saved.') noteEl.textContent = ''; }, 1800);
    if(editing != null) clearEditMode(id, 'Add entry');
  }else{
    noteEl.textContent = 'Could not save' + (window.lastFbError ? ' — ' + window.lastFbError : ' — please try again.');
    noteEl.style.color = 'var(--red)';
  }
  renderList(id);
}

async function editEntry(id, idx){
  const entries = await getEntries(id);
  const e = entries[idx];
  if(!e) return;
  document.getElementById(id + '-title').value = e.title || '';
  document.getElementById(id + '-date').value = e.date || '';
  document.getElementById(id + '-value').value = e.value || '';
  document.getElementById(id + '-contact-link').value = e.contactLink || '';
  document.getElementById(id + '-notes').value = e.notes || '';
  setEditMode(id, idx, 'Save changes');
  document.getElementById(id + '-title').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

/* ---------- entry CRUD: table rows ---------- */
async function addTableRow(id){
  const config = TABLE_LEAVES[id];
  const noteEl = document.getElementById(id + '-savenote');
  const row = {};
  let hasAny = false;
  config.columns.forEach(col => {
    if(col.type === 'computed') return;
    const val = document.getElementById(id + '-f-' + col.key).value.trim();
    row[col.key] = val;
    if(val) hasAny = true;
  });

  if(!hasAny){
    noteEl.textContent = "Fill in at least the client's name first.";
    noteEl.style.color = 'var(--red)';
    return;
  }

  const entries = await getEntries(id);
  const editing = editState[id];
  if(editing != null && entries[editing]){
    entries[editing] = { ...entries[editing], ...row };
  }else{
    row.ts = Date.now();
    entries.push(row);
  }
  const ok = await saveEntries(id, entries);

  if(ok){
    config.columns.forEach(col => {
      document.getElementById(id + '-f-' + col.key).value = '';
    });
    noteEl.textContent = editing != null ? 'Changes saved.' : 'Saved.';
    noteEl.style.color = 'var(--ink-soft)';
    setTimeout(() => { if(noteEl.textContent === 'Saved.' || noteEl.textContent === 'Changes saved.') noteEl.textContent = ''; }, 1800);
    if(editing != null) clearEditMode(id, 'Add client');
  }else{
    noteEl.textContent = 'Could not save' + (window.lastFbError ? ' — ' + window.lastFbError : ' — please try again.');
    noteEl.style.color = 'var(--red)';
  }
  await refreshAfterClientChange(id);
}

async function editTableRow(id, idx){
  const config = TABLE_LEAVES[id];
  const entries = await getEntries(id);
  const row = entries[idx];
  if(!row) return;
  config.columns.forEach(col => {
    if(col.type === 'computed') return;
    const value = col.type === 'date' ? dateInputValue(row[col.key]) : row[col.key];
    document.getElementById(id + '-f-' + col.key).value = value || '';
  });
  setEditMode(id, idx, 'Save changes');
  document.getElementById(id + '-f-' + config.columns[0].key).scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function showDeleteError(id, message){
  // Table/lead/servicing views don't render a form, so fall back to a
  // transient alert when there's no savenote element to write into.
  const noteEl = document.getElementById(id + '-savenote');
  if(noteEl){
    noteEl.textContent = message;
    noteEl.style.color = 'var(--red)';
    setTimeout(() => { if(noteEl.textContent === message) noteEl.textContent = ''; }, 4000);
  }else{
    alert(message);
  }
}

// Mirrors the key each side stamps on itself during sync, so delete can
// reliably find the linked record on the other side instead of guessing.
function clientOwnKey(client){
  return client.ts || `${client.name}|${client.submitted || ''}`;
}
function servicingOriginKey(service){
  return service.sourceClientKey || service.sourceLeadKey || `servicing:${service.ts || `${service.name}|${service.issuedDate || ''}`}`;
}

async function deleteEntry(id, idx){
  const entries = await getEntries(id);
  const record = entries[idx];
  if(!record) return;
  const linked = [];
  if(id === 'pru-clients'){
    const servicing = await getEntries('pru-servicing');
    const key = clientOwnKey(record);
    const match = servicing.filter(item =>
      item.sourceClientKey === key ||
      (!item.sourceClientKey && item.name === record.name && (item.issuedDate || item.submitted || '') === (record.submitted || ''))
    );
    match.forEach(item => linked.push({ sectionId:'pru-servicing', record:item }));
  }else if(id === 'pru-servicing'){
    const clients = await getEntries('pru-clients');
    // A servicing row's linked client is either the client it was originally
    // synced FROM (client.ts === record.sourceClientKey), or — if this
    // servicing row was added directly and later synced INTO clients — the
    // client whose sourceServicingKey points back at this row's origin key.
    const match = clients.filter(item =>
      (record.sourceClientKey && item.ts === record.sourceClientKey) ||
      item.sourceServicingKey === servicingOriginKey(record) ||
      item.name === record.name
    );
    match.forEach(item => linked.push({ sectionId:'pru-clients', record:item }));
  }

  // 1. Copy to Trash first. If this write fails, stop — nothing has been
  //    removed from the live lists yet, so there's nothing to roll back.
  const archived = await archiveTrash(id, [record], linked);
  if(!archived){
    showDeleteError(id, 'Could not remove' + (window.lastFbError ? ' — ' + window.lastFbError : ' — please try again.'));
    return;
  }

  // 2. Remove the record from its own section. If this write fails, undo
  //    the trash copy so we don't end up with a duplicate sitting there
  //    while the "live" record is still visible everywhere.
  entries.splice(idx, 1);
  const savedMain = await saveEntries(id, entries);
  if(!savedMain){
    await removeFromTrashByRecord(id, record);
    showDeleteError(id, 'Could not remove' + (window.lastFbError ? ' — ' + window.lastFbError : ' — please try again.'));
    await renderList(id);
    return;
  }

  // 3. Remove any linked record (client <-> servicing) from its section.
  //    If one of these fails, surface it but keep the primary delete —
  //    the trash copy still exists so nothing is lost, and refreshing
  //    will re-sync clients/servicing from whichever side saved.
  let linkedFailed = false;
  for(const item of linked){
    const other = await getEntries(item.sectionId);
    const otherIndex = other.indexOf(item.record);
    if(otherIndex >= 0){
      other.splice(otherIndex, 1);
      const savedLinked = await saveEntries(item.sectionId, other);
      if(!savedLinked) linkedFailed = true;
    }
  }

  await Promise.all(['pru-clients','pru-servicing'].filter(sectionId => sectionId !== id).map(sectionId => renderList(sectionId)));
  await refreshAfterClientChange(id);

  if(linkedFailed){
    showDeleteError(id, 'Removed, but a linked record could not be updated' + (window.lastFbError ? ' — ' + window.lastFbError : '.'));
  }
}

async function removeFromTrashByRecord(sectionId, record){
  const trash = await getEntries('pru-trash');
  const index = trash.findIndex(item => item.sectionId === sectionId && item.record === record);
  if(index >= 0){
    trash.splice(index, 1);
    await saveEntries('pru-trash', trash);
  }
}

async function clearEntries(id){
  if(!confirm('Remove all entries in this section? This cannot be undone.')) return;
  const entries = await getEntries(id);
  if(!(await archiveTrash(id, entries))) return;
  const ok = await saveEntries(id, []);
  if(!ok){
    // Undo the trash copy so a failed clear doesn't leave duplicates behind.
    const trash = await getEntries('pru-trash');
    const remaining = trash.filter(item => !(item.sectionId === id && entries.includes(item.record)));
    await saveEntries('pru-trash', remaining);
    showDeleteError(id, 'Could not clear entries' + (window.lastFbError ? ' — ' + window.lastFbError : ' — please try again.'));
    return;
  }
  await refreshAfterClientChange(id);
}

async function archiveTrash(sectionId, records, linked = []){
  if(!records || !records.length) return true;
  const trash = await getEntries('pru-trash');
  records.filter(Boolean).forEach(record => trash.push({ sectionId, record, deletedAt: new Date().toISOString(), trashId: `${sectionId}-${Date.now()}-${Math.random()}` }));
  linked.forEach(item => trash.push({ sectionId:item.sectionId, record:item.record, deletedAt: new Date().toISOString(), trashId: `${item.sectionId}-${Date.now()}-${Math.random()}` }));
  const ok = await saveEntries('pru-trash', trash);
  if(!ok) window.lastFbError = window.lastFbError || 'Trash could not be saved';
  return ok;
}
async function openTrash(){
  const modal = document.getElementById('trash-modal');
  if(!modal) return;
  await renderTrash();
  modal.classList.add('open');
}
function closeTrash(){ document.getElementById('trash-modal')?.classList.remove('open'); }
async function renderTrash(){
  const list = document.getElementById('trash-list');
  if(!list) return;
  const trash = await getEntries('pru-trash');
  list.innerHTML = trash.length ? trash.map((item, idx) => `
    <div class="trash-item"><div><div class="trash-item-title">${escapeHtml(item.record.name || item.record.title || 'Deleted record')}</div><div class="trash-item-meta">${escapeHtml(item.sectionId)} · deleted ${new Date(item.deletedAt).toLocaleString()}</div></div><button class="primary" onclick="restoreTrash(${idx})">Restore</button></div>`).join('') : '<div class="empty">Trash is empty.</div>';
}
async function restoreTrash(index){
  const trash = await getEntries('pru-trash');
  const item = trash[index];
  if(!item) return;
  const records = await getEntries(item.sectionId);
  records.push(item.record);
  await saveEntries(item.sectionId, records);
  trash.splice(index, 1);
  await saveEntries('pru-trash', trash);
  await refreshAfterClientChange(item.sectionId);
  await renderTrash();
}
async function emptyTrash(){
  if(!confirm('Permanently empty Trash? This cannot be undone.')) return;
  await saveEntries('pru-trash', []);
  await renderTrash();
}

/* ---------- init ---------- */
async function seedIfEmpty(){
  await Promise.all(Object.entries(SEED_DATA).map(async ([id, rows]) => {
    const existing = await getEntries(id);
    if(existing.length === 0){
      const seeded = rows.map(row => ({ ...row, ts: Date.now() + Math.random() }));
      await saveEntries(id, seeded);
    }
  }));
}

function renderTodayBadge(){
  const el = document.getElementById('today-badge');
  if(!el) return;
  const d = new Date();
  el.textContent = 'Today · ' + d.toLocaleDateString('en-US', { weekday:'short', year:'numeric', month:'short', day:'numeric' });
}

window.initApp = async function initApp(){
  restoreViewState();
  renderTodayBadge();
  renderGroupNav();
  renderBoxGrid();
  renderView();
  if(activeGroup === null){
    const nav = document.getElementById('group-nav');
    const home = document.getElementById('home-panel');
    if(nav) nav.classList.add('pop-in');
    if(home) home.classList.add('pop-in');
    setTimeout(() => {
      if(nav) nav.classList.remove('pop-in');
      if(home) home.classList.remove('pop-in');
    }, 900);
  }
  await primeCache();
  await Promise.all(allLeafIds().map(id => renderList(id)));
  await renderAllCounts();
  await renderWhatsNextPanel();

  await seedIfEmpty();
  await migrateExistingIssuedLeads();
  await syncClientsToServicing();
  await syncServicingToClients();
  await Promise.all(['pru-clients','pru-leads','pru-servicing'].map(id => renderList(id)));
  await renderAllCounts();
  await renderRewardsPanel();
  await renderPrufinPanel();
  await renderHmoCommissionsPanel();
  await renderMoneyIncomePanel();
  if(statisticsOpen) await renderStatisticsPanel();
  if(prufinStatsOpen) await renderPrufinStatisticsPanel();
};

  });
