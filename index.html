  const bcount = document.getElementById('bcount-' + id);
  if(bcount) bcount.textContent = entries.length;

  // Totals — computed regardless of entry count and shown big, above the table.
  const totals = {};
  config.totalKeys.forEach(k => totals[k] = 0);
  entries.forEach(row => {
    config.totalKeys.forEach(k => {
      const col = config.columns.find(c => c.key === k);
      totals[k] += (col && col.type === 'computed') ? clientFYP(row, fypAsOfDate) : parseCurrency(row[k]);
    });
  });
  if(totalsEl && id === 'hmo-clients'){
    const activeEntries = allEntries.filter(row => String(row.status || 'Active').toLowerCase() !== 'inactive');
    const inactiveEntries = allEntries.filter(row => String(row.status || '').toLowerCase() === 'inactive');
    const sumRows = (rows, key) => rows.reduce((sum, row) => sum + parseCurrency(row[key]), 0);
    totalsEl.innerHTML = `
      <div class="client-metrics">
        <div class="client-metrics-primary">
          <div class="client-metric"><div class="client-metric-label">Total Clients</div><div class="client-metric-value">${allEntries.length}</div></div>
          <div class="client-metric"><div class="client-metric-label">Active Clients</div><div class="client-metric-value">${activeEntries.length}</div></div>
          <div class="client-metric"><div class="client-metric-label">Inactive Clients</div><div class="client-metric-value">${inactiveEntries.length}</div></div>
          <div class="client-metric"><div class="client-metric-label">Total Premium</div><div class="client-metric-value">${fmtCurrency(sumRows(allEntries, 'premium'))}</div></div>
          <div class="client-metric"><div class="client-metric-label">Total APE</div><div class="client-metric-value">${fmtCurrency(sumRows(allEntries, 'ape'))}</div></div>
        </div>
      </div>`;
  }else if(totalsEl && id === 'pru-clients'){
    const today = new Date();
    const currentYear = today.getFullYear();
    const issuedEntries = allEntries.filter(row => !row.status || String(row.status).toLowerCase() === 'issued');
    const ownIssuedEntries = issuedEntries.filter(row => (row.clientType || 'Own') === 'Own');
    const ytdRows = issuedEntries.filter(row => {
      const issuedDate = submittedDateFromMonth(row.submitted, currentYear);
      return issuedDate
        && issuedDate.getFullYear() === currentYear
        && issuedDate <= today
        && (row.clientType || 'Own') === 'Own';
    });
    const ytdEntries = ytdRows.length;
    const sumRows = (rows, key) => rows.reduce((sum, row) => sum + parseCurrency(row[key]), 0);
    const ytdAPE = sumRows(ytdRows, 'ape');
    const ytdPremium = sumRows(ytdRows, 'premium');
    const ytdSA = sumRows(ytdRows, 'sa');
    const totalAPE = sumRows(issuedEntries, 'ape');
    const totalPremium = sumRows(issuedEntries, 'premium');
    const totalSA = sumRows(issuedEntries, 'sa');
    const ownCount = issuedEntries.filter(row => (row.clientType || 'Own') === 'Own').length;
    const adoptedCount = issuedEntries.filter(row => row.clientType === 'Adopted').length;
    totalsEl.innerHTML = `
      <div class="client-metrics">
        <div class="client-metrics-primary">
          <div class="client-metric"><div class="client-metric-label">YTD Total No. of Clients</div><div class="client-metric-value">${ytdEntries}</div></div>
          <div class="client-metric"><div class="client-metric-label">YTD Total APE</div><div class="client-metric-value">${fmtCurrency(ytdAPE)}</div></div>
          <div class="client-metric"><div class="client-metric-label">FYP</div><div class="client-metric-value">${fmtCurrency(ownIssuedEntries.reduce((sum, row) => sum + clientFYP(row, fypAsOfDate), 0))}</div></div>
          <div class="client-metric"><div class="client-metric-label">YTD Total Premium</div><div class="client-metric-value">${fmtCurrency(ytdPremium)}</div></div>
          <div class="client-metric"><div class="client-metric-label">YTD Total SA</div><div class="client-metric-value">${fmtCurrency(ytdSA)}</div></div>
        </div>
        <div class="client-metrics-secondary">
          <div class="client-metric secondary"><div class="client-metric-label">Active Clients</div><div class="client-metric-value">${ownCount + adoptedCount}</div></div>
          <div class="client-metric secondary"><div class="client-metric-label">Adopted Clients</div><div class="client-metric-value">${adoptedCount}</div></div>
          <div class="client-metric secondary"><div class="client-metric-label">Own Clients</div><div class="client-metric-value">${ownCount}</div></div>
          <div class="client-metric secondary"><div class="client-metric-label">Total APE Since Inception</div><div class="client-metric-value">${fmtCurrency(totalAPE)}</div></div>
          <div class="client-metric secondary"><div class="client-metric-label">Total Premium Since Inception</div><div class="client-metric-value">${fmtCurrency(totalPremium)}</div></div>
          <div class="client-metric secondary"><div class="client-metric-label">Total SA Since Inception</div><div class="client-metric-value">${fmtCurrency(totalSA)}</div></div>
        </div>
      </div>`;
  }

  if(id === 'pru-clients'){
    const toggleBtn = document.getElementById(id + '-toggle-clients');
    if(toggleBtn) toggleBtn.textContent = issuedClientsVisible ? 'Hide Clients' : 'Show Clients';
    if(!issuedClientsVisible){
      listEl.innerHTML = `<div class="rs-sub">Client list is hidden. Click "Show Clients" above to view the table.</div>`;
      await renderGroupCount(idToGroup(id));
      await renderRewardsPanel(); await renderPrufinPanel(); if(prufinStatsOpen) await renderPrufinStatisticsPanel();
      await renderMoneyIncomePanel();
      return;
    }
  }

  if(entries.length === 0){
    listEl.innerHTML = `<div class="empty">No entries yet — add your first client above.</div>`;
    await renderGroupCount(idToGroup(id));
    if(id === 'pru-clients'){ await renderRewardsPanel(); await renderPrufinPanel(); if(prufinStatsOpen) await renderPrufinStatisticsPanel(); }
    if(id === 'hmo-clients'){ await renderHmoCommissionsPanel(); }
    if(id === 'pru-clients' || id === 'hmo-clients'){ await renderMoneyIncomePanel(); }
    return;
  }

  const sortMode = sortState[id] || 'date-asc';
  const statusFiltered = sortMode === 'status-issued'
    ? entries.filter(row => !row.status || String(row.status).toLowerCase() === 'issued')
    : sortMode === 'status-lapsed'
      ? entries.filter(row => String(row.status || '').toLowerCase() === 'lapsed')
      : entries;
  const sorted = [...statusFiltered].sort((a, b) => {
    if(sortMode === 'name-asc'){
      return (a.name || '').toLowerCase().localeCompare((b.name || '').toLowerCase());
    }
    if(sortMode === 'date-asc'){
      const aDate = submittedDateFromMonth(a.submitted, 2026);
      const bDate = submittedDateFromMonth(b.submitted, 2026);
      return (aDate ? aDate.getTime() : 0) - (bDate ? bDate.getTime() : 0);
    }
    if(sortMode === 'plan-asc') return (a.plan || '').localeCompare(b.plan || '');
    if(sortMode === 'mode-asc') return (a.mode || '').localeCompare(b.mode || '');
    if(sortMode === 'ape-desc'){
      return parseCurrency(b.ape) - parseCurrency(a.ape);
    }
    return (a.ts || 0) - (b.ts || 0);
  });

  const sortSelect = document.getElementById(id + '-sort');
  if(sortSelect) sortSelect.value = sortMode;
  const yearSelect = document.getElementById(id + '-year');
  if(yearSelect) yearSelect.value = clientYearFilter;

  const headCells = config.columns.map(c => `<th>${c.label}</th>`).join('') + '<th></th>';
  const query = searchState[id] || '';
  const filtered = query
    ? sorted.filter(row => Object.values(row).some(value => String(value ?? '').toLowerCase().includes(query)))
    : sorted;
  const bodyRows = filtered.map(row => {
    const idx = allEntries.indexOf(row);
    const cells = config.columns.map(c => {
      const v = row[c.key];
      if(c.type === 'computed'){
        return `<td class="num">${fmtCurrency(clientFYP(row, fypAsOfDate))}</td>`;
      }
      if(c.type === 'currency'){
        return `<td class="num">${fmtCurrency(parseCurrency(v))}</td>`;
      }
      if(c.type === 'date'){
        return `<td>${escapeHtml(fmtIssuedDate(v || ''))}</td>`;
      }
      if(c.type === 'month'){
        return `<td>${escapeHtml(fmtMonthValue(v || ''))}</td>`;
      }
      if(c.type === 'url'){
        const href = contactHref(v);
        return `<td>${href ? `<a class="contact-link" href="${escapeHtml(href)}" target="_blank" rel="noopener">Open Link</a>` : ''}</td>`;
      }
      if(c.key === 'status' && v){
        return `<td><span class="status-pill status-${v.replace(' ','\\ ')}">${escapeHtml(v)}</span></td>`;
      }
      return `<td>${escapeHtml(v || '')}</td>`;
    }).join('');
    return `<tr>${cells}<td><button class="row-del" onclick="editTableRow('${id}', ${idx})">Edit</button>&nbsp;&nbsp;<button class="row-del" onclick="deleteEntry('${id}', ${idx})">Remove</button></td></tr>`;
  }).join('');

  listEl.innerHTML = `
    <div class="table-scroll">
      <table class="data-table">
        <thead><tr>${headCells}</tr></thead>
        <tbody>${bodyRows}</tbody>
      </table>
    </div>
  `;
  await renderGroupCount(idToGroup(id));
  if(id === 'pru-clients'){ await renderRewardsPanel(); await renderPrufinPanel(); if(prufinStatsOpen) await renderPrufinStatisticsPanel(); }
  if(id === 'hmo-clients'){ await renderHmoCommissionsPanel(); }
  if(id === 'pru-clients' || id === 'hmo-clients'){ await renderMoneyIncomePanel(); }
}

function idToGroup(leafId){
  const g = GROUPS.find(g => g.items.some(i => i.id === leafId));
  return g ? g.id : null;
}

async function renderGroupCount(groupId){
  if(!groupId) return;
  const group = GROUPS.find(g => g.id === groupId);
  const el = document.getElementById('gcount-' + groupId);
  if(group.id === 'sites'){
    if(el) el.textContent = group.items.length;
    return;
  }
  let total = 0;
  for(const item of group.items){
    const entries = await getEntries(item.id);
    total += entries.length;
  }
  if(el) el.textContent = total;
}

async function renderAllCounts(){
  await Promise.all(GROUPS.map(async g => {
    await Promise.all(g.items.filter(item => !item.url).map(async item => {
      const entries = await getEntries(item.id);
      const bcount = document.getElementById('bcount-' + item.id);
      if(bcount) bcount.textContent = entries.length;
    }));
    await renderGroupCount(g.id);
  }));
}

async function refreshAfterClientChange(id){
  if(id === 'pru-clients'){
    await syncClientsToServicing();
    await renderList('pru-servicing');
  }
  if(id === 'pru-servicing'){
    await syncServicingToClients();
    await renderList('pru-clients');
  }
  await renderList(id);
  await renderAllCounts();
  if(id === 'pru-clients'){
    await renderRewardsPanel();
    await renderPrufinPanel();
    if(prufinStatsOpen) await renderPrufinStatisticsPanel();
  }
}

/* ---------- edit-mode helpers ---------- */
function setEditMode(id, idx, label){
  editState[id] = idx;
  const btn = document.getElementById(id + '-submit');
  const cancel = document.getElementById(id + '-cancel');
  if(btn) btn.textContent = label;
  if(cancel) cancel.style.display = 'inline';
}
function clearEditMode(id, label){
  editState[id] = null;
  const btn = document.getElementById(id + '-submit');
  const cancel = document.getElementById(id + '-cancel');
  if(btn) btn.textContent = label;
  if(cancel) cancel.style.display = 'none';
}
function cancelEdit(id){
  if(TABLE_LEAVES[id]){
    const config = TABLE_LEAVES[id];
    config.columns.forEach(col => { if(col.type === 'computed') return; document.getElementById(id + '-f-' + col.key).value = ''; });
    clearEditMode(id, 'Add client');
  }else{
    document.getElementById(id + '-title').value = '';
    document.getElementById(id + '-date').value = '';
    document.getElementById(id + '-value').value = '';
    document.getElementById(id + '-contact-link').value = '';
    document.getElementById(id + '-notes').value = '';
    clearEditMode(id, 'Add entry');
  }
  const noteEl = document.getElementById(id + '-savenote');
  if(noteEl) noteEl.textContent = '';
}

/* ---------- entry CRUD: generic ---------- */
async function addEntry(id){
  const title = document.getElementById(id + '-title').value.trim();
  const date = document.getElementById(id + '-date').value;
  const value = document.getElementById(id + '-value').value.trim();
  const contactLink = document.getElementById(id + '-contact-link').value.trim();
  const notes = document.getElementById(id + '-notes').value.trim();
  const noteEl = document.getElementById(id + '-savenote');

  if(!title && !value && !notes && !contactLink){
    noteEl.textContent = 'Add at least a title, value, or note first.';
    noteEl.style.color = 'var(--red)';
    return;
  }

  const entries = await getEntries(id);
  const editing = editState[id];
  if(editing != null && entries[editing]){
    entries[editing] = { ...entries[editing], title, date, value, contactLink, notes };
  }else{
    entries.push({ title, date, value, contactLink, notes, ts: Date.now() });
  }
  const ok = await saveEntries(id, entries);

  if(ok){
    document.getElementById(id + '-title').value = '';
    document.getElementById(id + '-date').value = '';
    document.getElementById(id + '-value').value = '';
    document.getElementById(id + '-contact-link').value = '';
    document.getElementById(id + '-notes').value = '';
    noteEl.textContent = editing != null ? 'Changes saved.' : 'Saved.';
    noteEl.style.color = 'var(--ink-soft)';
    setTimeout(() => { if(noteEl.textContent === 'Saved.' || noteEl.textContent === 'Changes saved.') noteEl.textContent = ''; }, 1800);
    if(editing != null) clearEditMode(id, 'Add entry');
  }else{
    noteEl.textContent = 'Could not save' + (window.lastFbError ? ' — ' + window.lastFbError : ' — please try again.');
    noteEl.style.color = 'var(--red)';
  }
  renderList(id);
}

async function editEntry(id, idx){
  const entries = await getEntries(id);
  const e = entries[idx];
  if(!e) return;
  document.getElementById(id + '-title').value = e.title || '';
  document.getElementById(id + '-date').value = e.date || '';
  document.getElementById(id + '-value').value = e.value || '';
  document.getElementById(id + '-contact-link').value = e.contactLink || '';
  document.getElementById(id + '-notes').value = e.notes || '';
  setEditMode(id, idx, 'Save changes');
  document.getElementById(id + '-title').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

/* ---------- entry CRUD: table rows ---------- */
async function addTableRow(id){
  const config = TABLE_LEAVES[id];
  const noteEl = document.getElementById(id + '-savenote');
  const row = {};
  let hasAny = false;
  config.columns.forEach(col => {
    if(col.type === 'computed') return;
    const val = document.getElementById(id + '-f-' + col.key).value.trim();
    row[col.key] = val;
    if(val) hasAny = true;
  });

  if(!hasAny){
    noteEl.textContent = "Fill in at least the client's name first.";
    noteEl.style.color = 'var(--red)';
    return;
  }

  const entries = await getEntries(id);
  const editing = editState[id];
  if(editing != null && entries[editing]){
    entries[editing] = { ...entries[editing], ...row };
  }else{
    row.ts = Date.now();
    entries.push(row);
  }
  const ok = await saveEntries(id, entries);

  if(ok){
    config.columns.forEach(col => {
      document.getElementById(id + '-f-' + col.key).value = '';
    });
    noteEl.textContent = editing != null ? 'Changes saved.' : 'Saved.';
    noteEl.style.color = 'var(--ink-soft)';
    setTimeout(() => { if(noteEl.textContent === 'Saved.' || noteEl.textContent === 'Changes saved.') noteEl.textContent = ''; }, 1800);
    if(editing != null) clearEditMode(id, 'Add client');
  }else{
    noteEl.textContent = 'Could not save' + (window.lastFbError ? ' — ' + window.lastFbError : ' — please try again.');
    noteEl.style.color = 'var(--red)';
  }
  await refreshAfterClientChange(id);
}

async function editTableRow(id, idx){
  const config = TABLE_LEAVES[id];
  const entries = await getEntries(id);
  const row = entries[idx];
  if(!row) return;
  config.columns.forEach(col => {
    if(col.type === 'computed') return;
    const value = col.type === 'date' ? dateInputValue(row[col.key]) : row[col.key];
    document.getElementById(id + '-f-' + col.key).value = value || '';
  });
  setEditMode(id, idx, 'Save changes');
  document.getElementById(id + '-f-' + config.columns[0].key).scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function showDeleteError(id, message){
  // Table/lead/servicing views don't render a form, so fall back to a
  // transient alert when there's no savenote element to write into.
  const noteEl = document.getElementById(id + '-savenote');
  if(noteEl){
    noteEl.textContent = message;
    noteEl.style.color = 'var(--red)';
    setTimeout(() => { if(noteEl.textContent === message) noteEl.textContent = ''; }, 4000);
  }else{
    alert(message);
  }
}

// Mirrors the key each side stamps on itself during sync, so delete can
// reliably find the linked record on the other side instead of guessing.
function clientOwnKey(client){
  return client.ts || `${client.name}|${client.submitted || ''}`;
}
function servicingOriginKey(service){
  return service.sourceClientKey || service.sourceLeadKey || `servicing:${service.ts || `${service.name}|${service.issuedDate || ''}`}`;
}

async function deleteEntry(id, idx){
  const entries = await getEntries(id);
  const record = entries[idx];
  if(!record) return;
  const linked = [];
  if(id === 'pru-clients'){
    const servicing = await getEntries('pru-servicing');
    const key = clientOwnKey(record);
    const match = servicing.filter(item =>
      item.sourceClientKey === key ||
      (!item.sourceClientKey && item.name === record.name && (item.issuedDate || item.submitted || '') === (record.submitted || ''))
    );
    match.forEach(item => linked.push({ sectionId:'pru-servicing', record:item }));
  }else if(id === 'pru-servicing'){
    const clients = await getEntries('pru-clients');
    // A servicing row's linked client is either the client it was originally
    // synced FROM (client.ts === record.sourceClientKey), or — if this
    // servicing row was added directly and later synced INTO clients — the
    // client whose sourceServicingKey points back at this row's origin key.
    const match = clients.filter(item =>
      (record.sourceClientKey && item.ts === record.sourceClientKey) ||
      item.sourceServicingKey === servicingOriginKey(record) ||
      item.name === record.name
    );
    match.forEach(item => linked.push({ sectionId:'pru-clients', record:item }));
  }

  // 1. Copy to Trash first. If this write fails, stop — nothing has been
  //    removed from the live lists yet, so there's nothing to roll back.
  const archived = await archiveTrash(id, [record], linked);
  if(!archived){
    showDeleteError(id, 'Could not remove' + (window.lastFbError ? ' — ' + window.lastFbError : ' — please try again.'));
    return;
  }

  // 2. Remove the record from its own section. If this write fails, undo
  //    the trash copy so we don't end up with a duplicate sitting there
  //    while the "live" record is still visible everywhere.
  entries.splice(idx, 1);
  const savedMain = await saveEntries(id, entries);
  if(!savedMain){
    await removeFromTrashByRecord(id, record);
    showDeleteError(id, 'Could not remove' + (window.lastFbError ? ' — ' + window.lastFbError : ' — please try again.'));
    await renderList(id);
    return;
  }

  // 3. Remove any linked record (client <-> servicing) from its section.
  //    If one of these fails, surface it but keep the primary delete —
  //    the trash copy still exists so nothing is lost, and refreshing
  //    will re-sync clients/servicing from whichever side saved.
  let linkedFailed = false;
  for(const item of linked){
    const other = await getEntries(item.sectionId);
    const otherIndex = other.indexOf(item.record);
    if(otherIndex >= 0){
      other.splice(otherIndex, 1);
      const savedLinked = await saveEntries(item.sectionId, other);
      if(!savedLinked) linkedFailed = true;
    }
  }

  await Promise.all(['pru-clients','pru-servicing'].filter(sectionId => sectionId !== id).map(sectionId => renderList(sectionId)));
  await refreshAfterClientChange(id);

  if(linkedFailed){
    showDeleteError(id, 'Removed, but a linked record could not be updated' + (window.lastFbError ? ' — ' + window.lastFbError : '.'));
  }
}

async function removeFromTrashByRecord(sectionId, record){
  const trash = await getEntries('pru-trash');
  const index = trash.findIndex(item => item.sectionId === sectionId && item.record === record);
  if(index >= 0){
    trash.splice(index, 1);
    await saveEntries('pru-trash', trash);
  }
}

async function clearEntries(id){
  if(!confirm('Remove all entries in this section? This cannot be undone.')) return;
  const entries = await getEntries(id);
  if(!(await archiveTrash(id, entries))) return;
  const ok = await saveEntries(id, []);
  if(!ok){
    // Undo the trash copy so a failed clear doesn't leave duplicates behind.
    const trash = await getEntries('pru-trash');
    const remaining = trash.filter(item => !(item.sectionId === id && entries.includes(item.record)));
    await saveEntries('pru-trash', remaining);
    showDeleteError(id, 'Could not clear entries' + (window.lastFbError ? ' — ' + window.lastFbError : ' — please try again.'));
    return;
  }
  await refreshAfterClientChange(id);
}

async function archiveTrash(sectionId, records, linked = []){
  if(!records || !records.length) return true;
  const trash = await getEntries('pru-trash');
  records.filter(Boolean).forEach(record => trash.push({ sectionId, record, deletedAt: new Date().toISOString(), trashId: `${sectionId}-${Date.now()}-${Math.random()}` }));
  linked.forEach(item => trash.push({ sectionId:item.sectionId, record:item.record, deletedAt: new Date().toISOString(), trashId: `${item.sectionId}-${Date.now()}-${Math.random()}` }));
  const ok = await saveEntries('pru-trash', trash);
  if(!ok) window.lastFbError = window.lastFbError || 'Trash could not be saved';
  return ok;
}
async function openTrash(){
  const modal = document.getElementById('trash-modal');
  if(!modal) return;
  await renderTrash();
  modal.classList.add('open');
}
function closeTrash(){ document.getElementById('trash-modal')?.classList.remove('open'); }
async function renderTrash(){
  const list = document.getElementById('trash-list');
  if(!list) return;
  const trash = await getEntries('pru-trash');
  list.innerHTML = trash.length ? trash.map((item, idx) => `
    <div class="trash-item"><div><div class="trash-item-title">${escapeHtml(item.record.name || item.record.title || 'Deleted record')}</div><div class="trash-item-meta">${escapeHtml(item.sectionId)} · deleted ${new Date(item.deletedAt).toLocaleString()}</div></div><button class="primary" onclick="restoreTrash(${idx})">Restore</button></div>`).join('') : '<div class="empty">Trash is empty.</div>';
}
async function restoreTrash(index){
  const trash = await getEntries('pru-trash');
  const item = trash[index];
  if(!item) return;
  const records = await getEntries(item.sectionId);
  records.push(item.record);
  await saveEntries(item.sectionId, records);
  trash.splice(index, 1);
  await saveEntries('pru-trash', trash);
  await refreshAfterClientChange(item.sectionId);
  await renderTrash();
}
async function emptyTrash(){
  if(!confirm('Permanently empty Trash? This cannot be undone.')) return;
  await saveEntries('pru-trash', []);
  await renderTrash();
}

async function seedIfEmpty(){

}

    const home = document.getElementById('home-panel');
    if(nav) nav.classList.add('pop-in');
    if(home) home.classList.add('pop-in');
    setTimeout(() => {
      if(nav) nav.classList.remove('pop-in');
      if(home) home.classList.remove('pop-in');
    }, 900);
  }
  await primeCache();
  await Promise.all(allLeafIds().map(id => renderList(id)));
  await renderAllCounts();
  await renderWhatsNextPanel();

  await seedIfEmpty();
  await migrateExistingIssuedLeads();
  await syncClientsToServicing();
  await syncServicingToClients();
  await Promise.all(['pru-clients','pru-leads','pru-servicing'].map(id => renderList(id)));
  await renderAllCounts();
  await renderRewardsPanel();
  await renderPrufinPanel();
  await renderHmoCommissionsPanel();
  await renderMoneyIncomePanel();
  if(statisticsOpen) await renderStatisticsPanel();
  if(prufinStatsOpen) await renderPrufinStatisticsPanel();
};

// PWA: register the app-shell service worker (enables "Install" / Add to
// Home Screen). Safe to no-op if the file is opened without HTTPS/localhost
// or the browser doesn't support service workers.
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('Service worker registration failed:', err));
  });
}
</script>
